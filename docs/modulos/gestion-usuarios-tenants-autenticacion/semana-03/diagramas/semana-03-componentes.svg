<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <title>Semana 3 - Vista de componentes y dependencias</title>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs>
  <text x="450" y="24" text-anchor="middle" font-size="16" font-weight="bold">Capas y dependencias (las flechas apuntan hacia el núcleo)</text>

  <rect x="20" y="44" width="860" height="70" fill="#eef5ff" stroke="#5b8bd0"/><text x="30" y="62" font-weight="bold">Presentation</text>
  <rect x="330" y="72" width="240" height="32" fill="#fff" stroke="#333"/><text x="450" y="93" text-anchor="middle">AuthController (HTTP: 201/401/409/422/503)</text>

  <rect x="20" y="150" width="860" height="150" fill="#f1fbf1" stroke="#5aa55a"/><text x="30" y="168" font-weight="bold">Application (casos de uso y puertos)</text>
  <rect x="40" y="182" width="130" height="32" fill="#fff" stroke="#333"/><text x="105" y="203" text-anchor="middle">RegisterUser</text>
  <rect x="190" y="182" width="130" height="32" fill="#fff" stroke="#333"/><text x="255" y="203" text-anchor="middle">Authenticate</text>
  <rect x="340" y="182" width="130" height="32" fill="#fff" stroke="#333"/><text x="405" y="203" text-anchor="middle">RevokeSession</text>
  <rect x="490" y="182" width="130" height="32" fill="#fff" stroke="#333"/><text x="555" y="203" text-anchor="middle">ValidateSession</text>
  <g fill="#fff8dc" stroke="#333">
    <rect x="40" y="240" width="120" height="44"/><rect x="175" y="240" width="120" height="44"/><rect x="310" y="240" width="120" height="44"/><rect x="445" y="240" width="120" height="44"/><rect x="580" y="240" width="130" height="44"/><rect x="725" y="240" width="140" height="44"/>
  </g>
  <g text-anchor="middle" font-size="12"><text x="100" y="266">UserRepository</text><text x="235" y="266">SessionRepository</text><text x="370" y="266">TenantRepository</text><text x="505" y="266">PasswordHasher</text><text x="645" y="266">TokenGenerator</text><text x="795" y="266">Clock (puertos)</text></g>

  <rect x="20" y="336" width="420" height="80" fill="#fdf2e9" stroke="#d98c3b"/><text x="30" y="354" font-weight="bold">Domain (sin dependencias)</text>
  <rect x="50" y="368" width="150" height="34" fill="#fff" stroke="#333"/><text x="125" y="390" text-anchor="middle">User + reglas</text>
  <rect x="240" y="368" width="170" height="34" fill="#fff" stroke="#333"/><text x="325" y="390" text-anchor="middle">Session.isActiveAt</text>

  <rect x="470" y="336" width="410" height="80" fill="#f7eefb" stroke="#9a5bb5"/><text x="480" y="354" font-weight="bold">Persistence (adaptadores PDO)</text>
  <rect x="490" y="368" width="370" height="34" fill="#fff" stroke="#333"/><text x="675" y="390" text-anchor="middle">PdoUser / PdoSession / PdoTenant Repository</text>

  <rect x="470" y="450" width="410" height="50" fill="#fff" stroke="#333"/><text x="675" y="480" text-anchor="middle">Base de datos: tenants, users, sessions</text>

  <g stroke="#333" fill="none" marker-end="url(#a)">
    <path d="M450,104 V150"/><path d="M255,214 V240"/><path d="M200,314 V336" stroke-dasharray="5,3"/>
    <path d="M675,402 V450"/><path d="M490,385 H440" stroke-dasharray="5,3"/>
  </g>
  <text x="20" y="530">Los adaptadores PDO implementan los puertos (línea discontinua): la aplicación no conoce PDO. El dominio no importa nada.</text>
  <text x="20" y="548">Verificado en tests/run.php, sección F.</text>
</svg>
