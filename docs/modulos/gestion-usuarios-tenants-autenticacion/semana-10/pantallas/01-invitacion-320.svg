<svg xmlns="http://www.w3.org/2000/svg" width="320" height="820" viewBox="0 0 320 820" role="img" aria-labelledby="title desc"><title id="title">Invitar en H-01 — 320 px</title><desc id="desc">Wireframe móvil estático. Datos ficticios y seguridad de servidor pendiente.</desc><rect width="320" height="820" fill="#f2f6f7"/><rect width="320" height="90" fill="#153e49"/><g font-family="Arial,sans-serif"><text x="16" y="33" font-size="18" fill="white">HIS · Usuarios y sesiones</text><text x="16" y="61" font-size="13" fill="white">DEMO · Semana 10 · 320 px</text><text x="16" y="131" font-size="22" fill="#193c46">Invitar en H-01</text><rect x="16" y="155" width="288" height="402" rx="12" fill="white" stroke="#526b73"/><text x="28" y="190" font-size="13" fill="#243f47">Administrador demo autorizado</text><text x="28" y="236" font-size="13" fill="#243f47">Hospital H-01 · Contexto vigente</text><text x="28" y="282" font-size="13" fill="#243f47">Correo * persona@example.invalid</text><text x="28" y="328" font-size="13" fill="#243f47">Nombre * Persona demo</text><text x="28" y="374" font-size="13" fill="#243f47">Rol * Técnico de laboratorio</text><text x="28" y="420" font-size="13" fill="#243f47">Solo roles permitidos por servidor</text><text x="28" y="466" font-size="13" fill="#243f47">No pidas la contraseña de otra persona</text><text x="28" y="512" font-size="13" fill="#243f47">Revisar no envía invitación</text><rect x="16" y="585" width="288" height="52" rx="8" fill="#126574"/><text x="28" y="617" font-size="16" fill="white">Revisar invitación</text><rect x="16" y="653" width="288" height="48" rx="8" fill="white" stroke="#526b73"/><text x="28" y="683" font-size="15" fill="#243f47">Cancelar sin guardar</text><text x="16" y="750" font-size="13" fill="#243f47">Diseño estático · Sin credenciales reales</text><text x="16" y="778" font-size="13" fill="#243f47">El contexto visible no autoriza acceso</text></g></svg>