<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc">
  <title id="title">Secuencia REST de invitación, sesión y revocación</title>
  <desc id="desc">Administrador invita, usuario establece credenciales e inicia sesión, consulta el contexto y revoca la sesión persistida.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#46636a"/></marker>
    <style>
      .head{fill:#eaf5f2;stroke:#247b72;stroke-width:2;rx:8}.lifeline{stroke:#9aabad;stroke-width:1.5;stroke-dasharray:6 5}
      .msg{stroke:#46636a;stroke-width:1.6;fill:none;marker-end:url(#arrow)}.ret{stroke:#768a8e;stroke-width:1.3;stroke-dasharray:5 4;fill:none;marker-end:url(#arrow)}
      .txt{font-family:Segoe UI,Arial,sans-serif;fill:#17343b;font-size:12px}.bold{font-weight:700}
    </style>
  </defs>
  <text x="30" y="30" class="txt bold" font-size="20">Secuencia cliente-servidor: alta segura y sesión tenant-bound</text>
  <g class="txt bold" text-anchor="middle">
    <rect x="20" y="55" width="140" height="42" class="head"/><text x="90" y="81">Administrador / usuario</text>
    <rect x="195" y="55" width="130" height="42" class="head"/><text x="260" y="81">Cliente HIS</text>
    <rect x="360" y="55" width="130" height="42" class="head"/><text x="425" y="81">API REST</text>
    <rect x="525" y="55" width="150" height="42" class="head"/><text x="600" y="81">Aplicación</text>
    <rect x="720" y="55" width="160" height="42" class="head"/><text x="800" y="81">Repositorio / DB</text>
  </g>
  <g class="lifeline"><path d="M90 97V590"/><path d="M260 97V590"/><path d="M425 97V590"/><path d="M600 97V590"/><path d="M800 97V590"/></g>
  <g class="txt">
    <text x="20" y="125">Admin inicia invitación</text>
    <path d="M90 135H260" class="msg"/><text x="145" y="130">selecciona tenant</text>
    <path d="M260 165H425" class="msg"/><text x="274" y="159">POST /user-invitations</text>
    <path d="M425 195H600" class="msg"/><text x="440" y="189">sesión + permiso + tenant</text>
    <path d="M600 225H800" class="msg"/><text x="625" y="219">transacción: invite + membership</text>
    <path d="M800 250H600" class="ret"/><text x="680" y="245">commit</text>
    <path d="M600 275H425" class="ret"/><text x="455" y="270">invitationId, queued</text>
    <path d="M425 300H260" class="ret"/><text x="280" y="295">202 Accepted</text>
    <text x="20" y="330">Invitado establece secreto</text>
    <path d="M90 340H260" class="msg"/><text x="128" y="335">token de invitación</text>
    <path d="M260 370H425" class="msg"/><text x="270" y="365">POST /invitation-credentials</text>
    <path d="M425 400H600" class="msg"/><text x="450" y="395">consumo de un solo uso</text>
    <path d="M600 430H800" class="msg"/><text x="620" y="425">hash de credencial + activar</text>
    <path d="M800 455H600" class="ret"/><text x="685" y="450">commit</text>
    <path d="M425 480H260" class="ret"/><text x="290" y="475">204</text>
    <text x="20" y="510">Login y cierre</text>
    <path d="M260 520H425" class="msg"/><text x="278" y="515">POST /auth/sessions + tenant</text>
    <path d="M425 545H600" class="msg"/><text x="445" y="540">verificar y crear sesión</text>
    <path d="M600 570H800" class="msg"/><text x="630" y="565">guardar SHA-256, TTL 8h</text>
    <text x="260" y="605">Token solo tras commit; DELETE revoca antes de 204</text>
  </g>
</svg>
