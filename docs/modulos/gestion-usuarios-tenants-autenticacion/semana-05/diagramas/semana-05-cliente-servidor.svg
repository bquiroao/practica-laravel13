<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="390" viewBox="0 0 1040 390" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura cliente-servidor de identidad y sesiones</title>
  <desc id="desc">Cliente HTTPS consume API REST que delega en el módulo de identidad, adaptadores PDO y almacén. Notificaciones son una dependencia futura asíncrona.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#46636a"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#247b72;stroke-width:2;rx:12}.db{fill:#eff7f5;stroke:#247b72;stroke-width:2}
      .future{fill:#fff8e6;stroke:#a77b20;stroke-width:2;stroke-dasharray:7 5}
      .line{stroke:#46636a;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .dashed{stroke:#a77b20;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#arrow)}
      text{font-family:Segoe UI,Arial,sans-serif;fill:#17343b}.label{font-size:15px;font-weight:700}.small{font-size:12px}
    </style>
  </defs>
  <text x="30" y="35" class="label" font-size="21">Cliente-servidor; módulo interno, no microservicio desplegado</text>
  <rect x="30" y="125" width="155" height="100" class="box"/>
  <text x="107" y="160" text-anchor="middle" class="label">Usuario</text>
  <text x="107" y="185" text-anchor="middle" class="small">administrador</text>
  <text x="107" y="203" text-anchor="middle" class="small">o usuario HIS</text>
  <rect x="235" y="110" width="185" height="130" class="box"/>
  <text x="327" y="145" text-anchor="middle" class="label">Cliente web HIS</text>
  <text x="327" y="170" text-anchor="middle" class="small">HTTPS + JSON</text>
  <text x="327" y="190" text-anchor="middle" class="small">tenant de contexto</text>
  <text x="327" y="210" text-anchor="middle" class="small">sin lógica de autorización</text>
  <rect x="475" y="100" width="190" height="150" class="box"/>
  <text x="570" y="135" text-anchor="middle" class="label">API REST /api/v1</text>
  <text x="570" y="160" text-anchor="middle" class="small">controladores y DTO</text>
  <text x="570" y="180" text-anchor="middle" class="small">autenticar y autorizar</text>
  <text x="570" y="200" text-anchor="middle" class="small">resolver tenant</text>
  <text x="570" y="220" text-anchor="middle" class="small">problem details</text>
  <rect x="720" y="100" width="195" height="150" class="box"/>
  <text x="817" y="135" text-anchor="middle" class="label">Identidad y Sesiones</text>
  <text x="817" y="160" text-anchor="middle" class="small">casos de uso de Semana 3</text>
  <text x="817" y="180" text-anchor="middle" class="small">dominio y puertos</text>
  <text x="817" y="200" text-anchor="middle" class="small">tenant-bound</text>
  <text x="817" y="220" text-anchor="middle" class="small">sin SQL en el núcleo</text>
  <path d="M185 175 H235" class="line"/>
  <path d="M420 175 H475" class="line"/>
  <text x="447" y="160" text-anchor="middle" class="small">TLS</text>
  <path d="M665 175 H720" class="line"/>
  <rect x="735" y="295" width="180" height="70" class="db"/>
  <text x="825" y="323" text-anchor="middle" class="label">Repositorios PDO</text>
  <text x="825" y="345" text-anchor="middle" class="small">restricciones + ACID</text>
  <path d="M817 250 V295" class="line"/>
  <rect x="485" y="295" width="190" height="70" class="db"/>
  <text x="580" y="323" text-anchor="middle" class="label">Datos del módulo</text>
  <text x="580" y="345" text-anchor="middle" class="small">usuarios, membresía, sesión</text>
  <path d="M735 330 H675" class="line"/>
  <rect x="250" y="295" width="175" height="70" class="future"/>
  <text x="337" y="323" text-anchor="middle" class="label">Notificaciones</text>
  <text x="337" y="345" text-anchor="middle" class="small">outbox, pendiente</text>
  <path d="M720 225 C620 275 520 275 425 320" class="dashed"/>
  <text x="535" y="275" text-anchor="middle" class="small">evento asíncrono tras commit</text>
</svg>
