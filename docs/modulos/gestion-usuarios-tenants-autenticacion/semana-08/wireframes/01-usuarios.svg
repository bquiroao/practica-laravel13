<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc"><title id="title">Usuarios del tenant activo</title><desc id="desc">Wireframe anotado estático de usuarios y tenants; datos ficticios, sin seguridad real implementada.</desc><rect width="1100" height="700" fill="#f2f6f7"/><rect width="1100" height="76" fill="#153e49"/><g font-family="Arial,sans-serif"><text x="28" y="34" fill="white" font-size="18" font-weight="bold">HIS / USUARIOS Y SESIONES</text><text x="28" y="59" fill="#d0e2e6" font-size="14">Contexto de tenant · Identidad demo · Sin secretos reales</text><text x="28" y="122" fill="#193c46" font-size="25" font-weight="bold">Usuarios del tenant activo</text><rect x="28" y="150" width="690" height="432" rx="12" fill="white" stroke="#cbd9dd"/><text x="756" y="178" fill="#193c46" font-size="17" font-weight="bold">ANOTACIONES UX</text><text x="48" y="188" fill="#243f47" font-size="16">Administrador DEMO · Hospital H-01</text><text x="48" y="222" fill="#243f47" font-size="16">Tenant autenticado: H-01 · No es filtro libre</text><text x="48" y="256" fill="#243f47" font-size="16"></text><text x="48" y="290" fill="#243f47" font-size="16">No hay usuarios en esta lista de demostración.</text><text x="48" y="324" fill="#243f47" font-size="16">Vacío solo después de una consulta satisfactoria.</text><text x="48" y="358" fill="#243f47" font-size="16"></text><text x="48" y="392" fill="#243f47" font-size="16">Invitar crea contexto y membresía; no acceso a H-02.</text><text x="48" y="426" fill="#243f47" font-size="16">Ayuda: los permisos limitan los roles asignables.</text><text x="756" y="216" fill="#3c5962" font-size="15">1. Rol administrador autorizado.</text><text x="756" y="246" fill="#3c5962" font-size="15">2. Carga usa esqueleto y aviso.</text><text x="756" y="276" fill="#3c5962" font-size="15">3. Falla de lectura no es vacío.</text><text x="756" y="306" fill="#3c5962" font-size="15">4. No mostrar datos de otro tenant.</text><text x="756" y="336" fill="#3c5962" font-size="15">5. Sin permiso: denegar sin lista.</text><rect x="28" y="606" width="570" height="48" rx="8" fill="#126574"/><text x="48" y="637" fill="white" font-size="17">Invitar usuario en H-01</text><text x="756" y="637" fill="#526b73" font-size="14">Propuesta estática · Semana 8</text></g></svg>