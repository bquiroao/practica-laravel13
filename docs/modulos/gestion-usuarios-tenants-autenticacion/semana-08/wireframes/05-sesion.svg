<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc"><title id="title">Sesión actual y cierre</title><desc id="desc">Wireframe anotado estático de usuarios y tenants; datos ficticios, sin seguridad real implementada.</desc><rect width="1100" height="700" fill="#f2f6f7"/><rect width="1100" height="76" fill="#153e49"/><g font-family="Arial,sans-serif"><text x="28" y="34" fill="white" font-size="18" font-weight="bold">HIS / USUARIOS Y SESIONES</text><text x="28" y="59" fill="#d0e2e6" font-size="14">Contexto de tenant · Identidad demo · Sin secretos reales</text><text x="28" y="122" fill="#193c46" font-size="25" font-weight="bold">Sesión actual y cierre</text><rect x="28" y="150" width="690" height="432" rx="12" fill="white" stroke="#cbd9dd"/><text x="756" y="178" fill="#193c46" font-size="17" font-weight="bold">ANOTACIONES UX</text><text x="48" y="188" fill="#243f47" font-size="16">Persona DEMO · Hospital H-01</text><text x="48" y="222" fill="#243f47" font-size="16">Sesión actual: activa · Expiración limitada</text><text x="48" y="256" fill="#243f47" font-size="16">Referencia no secreta: SES-DEMO-01</text><text x="48" y="290" fill="#243f47" font-size="16"></text><text x="48" y="324" fill="#243f47" font-size="16">Cerrar revoca esta sesión, no todas las sesiones.</text><text x="48" y="358" fill="#243f47" font-size="16">Confirmación: ¿Cerrar la sesión actual?</text><text x="48" y="392" fill="#243f47" font-size="16">[Cancelar: seguir aquí]</text><text x="48" y="426" fill="#243f47" font-size="16">[Confirmar cierre]</text><text x="48" y="460" fill="#243f47" font-size="16"></text><text x="48" y="494" fill="#243f47" font-size="16">Tras persistir: Sesión cerrada; volver a login.</text><text x="48" y="528" fill="#243f47" font-size="16">No mostrar el bearer ni claims sensibles.</text><text x="756" y="216" fill="#3c5962" font-size="15">1. Solo sesión propia autorizada.</text><text x="756" y="246" fill="#3c5962" font-size="15">2. No revocar usuarios ajenos.</text><text x="756" y="276" fill="#3c5962" font-size="15">3. No éxito antes del almacén.</text><text x="756" y="306" fill="#3c5962" font-size="15">4. JWT, si se usa, debe validarse</text><text x="756" y="336" fill="#3c5962" font-size="15">   en servidor, no por la vista.</text><text x="756" y="366" fill="#3c5962" font-size="15">5. Revocada no vuelve a activa.</text><rect x="28" y="606" width="570" height="48" rx="8" fill="#126574"/><text x="48" y="637" fill="white" font-size="17">Confirmar cierre de sesión</text><text x="756" y="637" fill="#526b73" font-size="14">Propuesta estática · Semana 8</text></g></svg>