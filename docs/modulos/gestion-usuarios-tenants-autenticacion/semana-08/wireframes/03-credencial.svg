<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc"><title id="title">Aceptar invitación y credencial</title><desc id="desc">Wireframe anotado estático de usuarios y tenants; datos ficticios, sin seguridad real implementada.</desc><rect width="1100" height="700" fill="#f2f6f7"/><rect width="1100" height="76" fill="#153e49"/><g font-family="Arial,sans-serif"><text x="28" y="34" fill="white" font-size="18" font-weight="bold">HIS / USUARIOS Y SESIONES</text><text x="28" y="59" fill="#d0e2e6" font-size="14">Contexto de tenant · Identidad demo · Sin secretos reales</text><text x="28" y="122" fill="#193c46" font-size="25" font-weight="bold">Aceptar invitación y credencial</text><rect x="28" y="150" width="690" height="432" rx="12" fill="white" stroke="#cbd9dd"/><text x="756" y="178" fill="#193c46" font-size="17" font-weight="bold">ANOTACIONES UX</text><text x="48" y="188" fill="#243f47" font-size="16">Persona invitada · Hospital H-01</text><text x="48" y="222" fill="#243f47" font-size="16">Invitación válida de un solo uso · Datos ficticios</text><text x="48" y="256" fill="#243f47" font-size="16"></text><text x="48" y="290" fill="#243f47" font-size="16">Contraseña propia * [ •••••••••••• ]</text><text x="48" y="324" fill="#243f47" font-size="16">Confirmar contraseña * [ •••••••••••• ]</text><text x="48" y="358" fill="#243f47" font-size="16">Mostrar contraseña: decisión explícita del usuario</text><text x="48" y="392" fill="#243f47" font-size="16"></text><text x="48" y="426" fill="#243f47" font-size="16">Ayuda: consulta la política vigente de credenciales.</text><text x="48" y="460" fill="#243f47" font-size="16">La invitación y el alta se confirman juntas.</text><text x="48" y="494" fill="#243f47" font-size="16">No mostrar token en URL, pantalla ni evidencia.</text><text x="756" y="216" fill="#3c5962" font-size="15">1. Validar política acordada.</text><text x="756" y="246" fill="#3c5962" font-size="15">2. Coincidencia de confirmación.</text><text x="756" y="276" fill="#3c5962" font-size="15">3. No inventar longitud mínima.</text><text x="756" y="306" fill="#3c5962" font-size="15">4. Vencida/usada: no activar.</text><text x="756" y="336" fill="#3c5962" font-size="15">5. Cancelar no consume invitación.</text><text x="756" y="366" fill="#3c5962" font-size="15">6. Sin éxito antes de persistencia.</text><rect x="28" y="606" width="570" height="48" rx="8" fill="#126574"/><text x="48" y="637" fill="white" font-size="17">Aceptar y establecer credencial</text><text x="756" y="637" fill="#526b73" font-size="14">Propuesta estática · Semana 8</text></g></svg>