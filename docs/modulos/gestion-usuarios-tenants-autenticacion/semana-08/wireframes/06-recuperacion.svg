<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc"><title id="title">La revocación no se confirmó</title><desc id="desc">Wireframe anotado estático de usuarios y tenants; datos ficticios, sin seguridad real implementada.</desc><rect width="1100" height="700" fill="#f2f6f7"/><rect width="1100" height="76" fill="#153e49"/><g font-family="Arial,sans-serif"><text x="28" y="34" fill="white" font-size="18" font-weight="bold">HIS / USUARIOS Y SESIONES</text><text x="28" y="59" fill="#d0e2e6" font-size="14">Contexto de tenant · Identidad demo · Sin secretos reales</text><text x="28" y="122" fill="#193c46" font-size="25" font-weight="bold">La revocación no se confirmó</text><rect x="28" y="150" width="690" height="432" rx="12" fill="white" stroke="#cbd9dd"/><text x="756" y="178" fill="#193c46" font-size="17" font-weight="bold">ANOTACIONES UX</text><text x="48" y="188" fill="#243f47" font-size="16">No se confirmó el cierre de la sesión.</text><text x="48" y="222" fill="#243f47" font-size="16">No te mostraremos “sesión cerrada” sin confirmación.</text><text x="48" y="256" fill="#243f47" font-size="16">Referencia de operación: OP-DEMO-01</text><text x="48" y="290" fill="#243f47" font-size="16"></text><text x="48" y="324" fill="#243f47" font-size="16">Falla confirmada: ofrecer reintento seguro.</text><text x="48" y="358" fill="#243f47" font-size="16">Respuesta desconocida: comprobar antes de decidir.</text><text x="48" y="392" fill="#243f47" font-size="16">Almacén no disponible: sin acceso permisivo por defecto.</text><text x="48" y="426" fill="#243f47" font-size="16"></text><text x="48" y="460" fill="#243f47" font-size="16">Invitación vencida/usada: solicitar otra por canal seguro.</text><text x="48" y="494" fill="#243f47" font-size="16">Sesión expirada: autenticarse de nuevo.</text><text x="756" y="216" fill="#3c5962" font-size="15">1. Variantes por causa, no mezcla</text><text x="756" y="246" fill="#3c5962" font-size="15">   de errores al usuario final.</text><text x="756" y="276" fill="#3c5962" font-size="15">2. Conservar contexto no sensible.</text><text x="756" y="306" fill="#3c5962" font-size="15">3. No guardar contraseña borrador.</text><text x="756" y="336" fill="#3c5962" font-size="15">4. Respetar espera del servicio.</text><text x="756" y="366" fill="#3c5962" font-size="15">5. No reenviar invitaciones o</text><text x="756" y="396" fill="#3c5962" font-size="15">   recrear sesiones a ciegas.</text><rect x="28" y="606" width="570" height="48" rx="8" fill="#126574"/><text x="48" y="637" fill="white" font-size="17">Comprobar / reintentar según estado</text><text x="756" y="637" fill="#526b73" font-size="14">Propuesta estática · Semana 8</text></g></svg>