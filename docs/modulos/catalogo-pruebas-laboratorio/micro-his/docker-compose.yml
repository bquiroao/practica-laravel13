services:
  micro-lab-postgres:
    image: postgres:16
    container_name: micro-lab-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lab_local_2026   # clave solo para desarrollo local
      POSTGRES_DB: micro_lab
    ports:
      - "55441:5432"
    volumes:
      - micro-lab-datos:/var/lib/postgresql/data
      - ./docker/01-bases.sql:/docker-entrypoint-initdb.d/01-bases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d micro_lab"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  micro-lab-datos:
