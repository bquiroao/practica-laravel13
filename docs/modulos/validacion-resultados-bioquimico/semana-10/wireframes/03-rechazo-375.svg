<svg xmlns="http://www.w3.org/2000/svg" width="375" height="790" viewBox="0 0 375 790" role="img" aria-labelledby="title desc"><title id="title">Rechazar con motivo</title><desc id="desc">Propuesta móvil estática de 375 px. Datos ficticios; no interfaz ejecutable.</desc><rect width="100%" height="100%" fill="#f2f6f7"/><rect width="100%" height="88" fill="#143e49"/><g font-family="Arial,sans-serif"><text x="16" y="30" fill="white" font-size="15" font-weight="bold">HIS / REVISIÓN BIOQUÍMICA</text><text x="16" y="59" fill="#d2e6e8" font-size="13">H-01 · Bioquímica DEMO</text><text x="16" y="132" fill="#193c46" font-size="21" font-weight="bold">Rechazar con motivo</text><rect x="16" y="160" width="343" height="470" rx="12" fill="white" stroke="#cbd9dd"/><text x="28" y="192" fill="#243f47" font-size="14">R-DEMO-01 · Pendiente · v1</text><text x="28" y="226" fill="#243f47" font-size="14">Valor revisado: 105,0 mg/dL</text><text x="28" y="260" fill="#243f47" font-size="14"></text><text x="28" y="294" fill="#243f47" font-size="14">Motivo obligatorio *</text><text x="28" y="328" fill="#243f47" font-size="14">[ Muestra inadecuada         ]</text><text x="28" y="362" fill="#243f47" font-size="14">Explica el motivo de la decisión.</text><text x="28" y="396" fill="#243f47" font-size="14"></text><text x="28" y="430" fill="#243f47" font-size="14">Error si está vacío:</text><text x="28" y="464" fill="#243f47" font-size="14">Escribe un motivo para continuar.</text><text x="28" y="498" fill="#243f47" font-size="14"></text><text x="28" y="532" fill="#243f47" font-size="14">← Cancelar conserva la revisión</text><rect x="16" y="650" width="343" height="48" rx="8" fill="#126574"/><text x="187.5" y="680" text-anchor="middle" fill="white" font-size="15">Revisar rechazo</text><text x="16" y="735" fill="#526b73" font-size="12">Datos ficticios · Wireframe 375 px</text><text x="16" y="759" fill="#526b73" font-size="12">Semana 10 · Desplazamiento vertical</text></g></svg>