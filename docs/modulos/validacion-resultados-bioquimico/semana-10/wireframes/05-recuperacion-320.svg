<svg xmlns="http://www.w3.org/2000/svg" width="320" height="790" viewBox="0 0 320 790" role="img" aria-labelledby="title desc"><title id="title">Comprobar decisión</title><desc id="desc">Propuesta móvil estática de 320 px. Datos ficticios; no interfaz ejecutable.</desc><rect width="100%" height="100%" fill="#f2f6f7"/><rect width="100%" height="88" fill="#143e49"/><g font-family="Arial,sans-serif"><text x="16" y="30" fill="white" font-size="15" font-weight="bold">HIS / REVISIÓN BIOQUÍMICA</text><text x="16" y="59" fill="#d2e6e8" font-size="13">H-01 · Bioquímica DEMO</text><text x="16" y="132" fill="#193c46" font-size="21" font-weight="bold">Comprobar decisión</text><rect x="16" y="160" width="288" height="470" rx="12" fill="white" stroke="#cbd9dd"/><text x="28" y="192" fill="#243f47" font-size="14">La respuesta no llegó.</text><text x="28" y="226" fill="#243f47" font-size="14">No sabemos si quedó registrada.</text><text x="28" y="260" fill="#243f47" font-size="14">R-DEMO-01 · Versión revisada 1</text><text x="28" y="294" fill="#243f47" font-size="14"></text><text x="28" y="328" fill="#243f47" font-size="14">No vuelvas a firmar a ciegas.</text><text x="28" y="362" fill="#243f47" font-size="14">Comprueba estado al reconectar.</text><text x="28" y="396" fill="#243f47" font-size="14"></text><text x="28" y="430" fill="#243f47" font-size="14">Si cambió: recargar y revisar.</text><text x="28" y="464" fill="#243f47" font-size="14">Si es final: mostrar trazabilidad.</text><text x="28" y="498" fill="#243f47" font-size="14">Sin confirmar: no anunciar éxito.</text><rect x="16" y="650" width="288" height="48" rx="8" fill="#126574"/><text x="160" y="680" text-anchor="middle" fill="white" font-size="15">Comprobar estado</text><text x="16" y="735" fill="#526b73" font-size="12">Datos ficticios · Wireframe 320 px</text><text x="16" y="759" fill="#526b73" font-size="12">Semana 10 · Desplazamiento vertical</text></g></svg>