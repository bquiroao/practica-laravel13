<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <title>Semana 6 - Arquitectura trazable de validación bioquímica</title>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs>
  <text x="490" y="24" text-anchor="middle" font-size="16" font-weight="bold">Arquitectura propuesta con trazabilidad de decisiones (Semana 6)</text>

  <rect x="20" y="56" width="180" height="48" fill="#fff" stroke="#333"/><text x="110" y="84" text-anchor="middle">Bioquímico/a</text>
  <rect x="20" y="128" width="180" height="56" fill="#fff" stroke="#333" stroke-dasharray="6,3"/><text x="110" y="154" text-anchor="middle">UI de revisión</text><text x="110" y="172" text-anchor="middle" font-size="11">(propuesta)</text>

  <rect x="240" y="50" width="220" height="220" fill="#eef5ff" stroke="#5b8bd0"/><text x="250" y="72" font-weight="bold">Presentation / API</text>
  <rect x="260" y="88" width="180" height="40" fill="#fff" stroke="#333"/><text x="350" y="110" text-anchor="middle">API REST /api/v1</text><text x="350" y="124" text-anchor="middle" font-size="11">DEC-01</text>
  <rect x="260" y="136" width="180" height="32" fill="#fff" stroke="#333"/><text x="350" y="156" text-anchor="middle">ReviewController</text>
  <rect x="260" y="176" width="180" height="32" fill="#fff" stroke="#333"/><text x="350" y="196" text-anchor="middle">Auth/Sesión</text>
  <rect x="260" y="216" width="180" height="32" fill="#fff" stroke="#333"/><text x="350" y="236" text-anchor="middle">Firma + TraceId policy</text>

  <rect x="490" y="50" width="230" height="220" fill="#f1fbf1" stroke="#5aa55a"/><text x="500" y="72" font-weight="bold">Application / Domain</text>
  <rect x="510" y="88" width="190" height="42" fill="#fff" stroke="#333"/><text x="605" y="110" text-anchor="middle">ReviewPendingLabResult</text><text x="605" y="124" text-anchor="middle" font-size="11">DEC-03, DEC-05</text>
  <rect x="510" y="140" width="190" height="30" fill="#fff" stroke="#333"/><text x="605" y="160" text-anchor="middle">ReviewerAuthorization</text>
  <rect x="510" y="176" width="190" height="30" fill="#fff" stroke="#333"/><text x="605" y="196" text-anchor="middle">Clock</text>
  <rect x="510" y="212" width="190" height="30" fill="#fff" stroke="#333"/><text x="605" y="232" text-anchor="middle">ReviewOutcome / estados</text>

  <rect x="750" y="50" width="210" height="220" fill="#f7eefb" stroke="#9a5bb5"/><text x="760" y="72" font-weight="bold">Persistence / Integración</text>
  <rect x="770" y="88" width="170" height="30" fill="#fff" stroke="#333"/><text x="855" y="108" text-anchor="middle">DecisionRepository</text>
  <rect x="770" y="126" width="170" height="30" fill="#fff" stroke="#333"/><text x="855" y="146" text-anchor="middle">InMemory (actual)</text>
  <rect x="770" y="164" width="170" height="30" fill="#fff" stroke="#333"/><text x="855" y="184" text-anchor="middle">PDO (futuro)</text>
  <rect x="770" y="202" width="170" height="30" fill="#fff8dc" stroke="#333"/><text x="855" y="222" text-anchor="middle">Resultados + decisiones</text>
  <rect x="770" y="240" width="170" height="30" fill="#eef5ff" stroke="#5b8bd0"/><text x="855" y="260" text-anchor="middle">Ingreso (origen)</text>

  <g stroke="#333" fill="none" marker-end="url(#a)">
    <path d="M110,104 V128"/><path d="M200,156 H260"/>
    <path d="M440,108 H510"/><path d="M440,156 H510"/>
    <path d="M350,128 V176"/><path d="M350,208 V216"/>
    <path d="M440,232 H510"/>
    <path d="M700,108 H770"/>
    <path d="M700,156 H770"/><path d="M700,192 H770"/>
    <path d="M855,118 V126"/><path d="M855,156 V164"/><path d="M855,194 V202"/>
    <path d="M770,255 H720 V220 H700"/>
  </g>

  <rect x="20" y="300" width="940" height="290" fill="#fff" stroke="#bbb"/>
  <text x="30" y="326" font-weight="bold">Matriz de trazabilidad (decisión -> evidencia)</text>
  <text x="30" y="350">DEC-01 Cliente-servidor y contrato API. Evidencia: semana-05 contrato REST propuesto + este diagrama.</text>
  <text x="30" y="372">DEC-02 Actor/hospital desde sesión. Evidencia: contrato simulado de semana-05 y script semana-06.</text>
  <text x="30" y="394">DEC-03 Mantener caso de uso y estados del dominio. Evidencia: ReviewPendingLabResult (semana-02).</text>
  <text x="30" y="416">DEC-04 Cambio práctico: firma obligatoria y traceId por decisión. Evidencia: verificacion/cambio-practico.php.</text>
  <text x="30" y="438">DEC-05 Concurrencia y estado: versión/conflicto/invalid_state se conservan. Evidencia: comprobaciones del script.</text>
  <text x="30" y="460">RF/RNF: revisión bioquímica, validación/rechazo, trazabilidad y control de acceso por hospital.</text>
  <text x="30" y="482">Estado de implementación: propuesta defendida con verificación en memoria; sin persistencia de firma en producción.</text>
</svg>

