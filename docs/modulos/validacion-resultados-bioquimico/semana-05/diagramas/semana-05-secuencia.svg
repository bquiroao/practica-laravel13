<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <title>Semana 5 - Decisión con idempotencia y versión</title>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs>
  <text x="470" y="24" text-anchor="middle" font-size="16" font-weight="bold">POST de decisión: idempotencia, versión y estado</text>
  <g font-weight="bold" text-anchor="middle">
    <rect x="20" y="40" width="120" height="30" fill="#eef5ff" stroke="#333"/><text x="80" y="60">Cliente</text>
    <rect x="220" y="40" width="130" height="30" fill="#eef5ff" stroke="#333"/><text x="285" y="60">API Validación</text>
    <rect x="440" y="40" width="190" height="30" fill="#eef5ff" stroke="#333"/><text x="535" y="60">ReviewPendingLabResult</text>
    <rect x="740" y="40" width="160" height="30" fill="#eef5ff" stroke="#333"/><text x="820" y="60">BD Validación</text>
  </g>
  <g stroke="#999" stroke-dasharray="4,4"><path d="M80,70 V620"/><path d="M285,70 V620"/><path d="M535,70 V620"/><path d="M820,70 V620"/></g>
  <g stroke="#333" fill="none" marker-end="url(#a)">
    <path d="M80,100 H285"/><path d="M285,250 H535"/><path d="M535,280 H820"/><path d="M535,480 H820"/>
  </g>
  <g stroke="#333" fill="none" stroke-dasharray="5,3" marker-end="url(#a)">
    <path d="M285,130 H80"/><path d="M285,170 H80"/><path d="M820,300 H535"/>
    <path d="M285,330 H80"/><path d="M285,370 H80"/><path d="M285,410 H80"/><path d="M285,450 H80"/><path d="M285,520 H80"/><path d="M285,560 H80"/>
  </g>
  <text x="90" y="94" font-size="12">POST /results/id/decisions + Idempotency-Key + If-Match</text>
  <text x="90" y="124" font-size="12" fill="#721c24">sin sesión 401, sin clave 400, sin If-Match 428</text>
  <text x="90" y="164" font-size="12">clave repetida: respuesta original (o 409 si cambió)</text>
  <text x="295" y="244" font-size="12">clave nueva: execute(...)</text>
  <text x="545" y="274" font-size="12">findById</text>
  <text x="90" y="324" font-size="12" fill="#721c24">otro hospital o inexistente: 404</text>
  <text x="90" y="364" font-size="12" fill="#721c24">versión distinta: 409 version-conflict</text>
  <text x="90" y="404" font-size="12" fill="#721c24">ya decidido: 409 already-decided</text>
  <text x="90" y="444" font-size="12" fill="#721c24">rechazo sin motivo: 422</text>
  <text x="545" y="474" font-size="12">decideAtomically: estado + decisión + outbox</text>
  <text x="90" y="514" font-size="12" fill="#721c24">falla de la base: 503 (la clave no se guarda)</text>
  <text x="90" y="554" font-size="12">guardado: 201</text>
  <rect x="20" y="578" width="900" height="50" fill="#fff8dc" stroke="#333"/>
  <text x="30" y="598">Actor y hospital salen de la sesión. Propuesta: el prototipo no tiene API, idempotencia, adaptador PDO ni outbox.</text>
  <text x="30" y="616">Límite medido: la versión no cambia al decidir; el 409 de reintento lo produce el estado.</text>
</svg>
