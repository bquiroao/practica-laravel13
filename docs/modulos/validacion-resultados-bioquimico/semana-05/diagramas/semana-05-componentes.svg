<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <title>Semana 5 - Cliente-servidor y frontera del módulo de validación</title>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs>
  <text x="470" y="24" text-anchor="middle" font-size="16" font-weight="bold">Frontera del módulo de validación (sólido: existe; discontinuo: propuesto)</text>

  <rect x="20" y="50" width="170" height="52" fill="#fff" stroke="#333"/><text x="105" y="82" text-anchor="middle">Bioquímico/a</text>
  <rect x="20" y="170" width="170" height="60" fill="#fff" stroke="#333" stroke-dasharray="6,3"/><text x="105" y="196" text-anchor="middle">Cliente web</text><text x="105" y="214" text-anchor="middle">(propuesto)</text>

  <rect x="260" y="44" width="500" height="400" fill="#f1fbf1" stroke="#5aa55a" stroke-width="2"/>
  <text x="270" y="64" font-weight="bold">Módulo Validación (monolito modular)</text>
  <rect x="290" y="84" width="440" height="52" fill="#fff" stroke="#333" stroke-dasharray="6,3"/><text x="510" y="106" text-anchor="middle">API REST /api/v1 (adaptador HTTP)</text><text x="510" y="124" text-anchor="middle">propuesto</text>
  <rect x="290" y="170" width="440" height="48" fill="#fff" stroke="#333"/><text x="510" y="192" text-anchor="middle">ReviewPendingLabResult</text><text x="510" y="208" text-anchor="middle" font-size="11">3 puertos: autorización, reloj, repositorio</text>
  <rect x="290" y="260" width="200" height="48" fill="#fff" stroke="#333"/><text x="390" y="282" text-anchor="middle">DecisionRepository</text><text x="390" y="298" text-anchor="middle" font-size="11">InMemory existe; PDO falta</text>
  <rect x="530" y="260" width="200" height="48" fill="#fff" stroke="#333" stroke-dasharray="6,3"/><text x="630" y="290" text-anchor="middle">Outbox de eventos</text>
  <rect x="290" y="350" width="440" height="70" fill="#fff8dc" stroke="#333"/><text x="510" y="376" text-anchor="middle">BD: resultado (estado) + decisión, en una transacción</text><text x="510" y="396" text-anchor="middle">+ idempotency_keys y outbox (propuestos)</text>

  <rect x="800" y="60" width="130" height="60" fill="#eef5ff" stroke="#5b8bd0"/><text x="865" y="86" text-anchor="middle">Auth</text><text x="865" y="104" text-anchor="middle" font-size="11">sesión, rol, hospital</text>
  <rect x="800" y="170" width="130" height="60" fill="#fdecea" stroke="#c0504d"/><text x="865" y="194" text-anchor="middle">Ingreso de</text><text x="865" y="212" text-anchor="middle">resultados</text>
  <rect x="800" y="270" width="130" height="60" fill="#eef5ff" stroke="#5b8bd0"/><text x="865" y="296" text-anchor="middle">Órdenes / Muestras</text><text x="865" y="314" text-anchor="middle" font-size="11">solo referencias</text>
  <rect x="800" y="380" width="130" height="60" fill="#f7eefb" stroke="#9a5bb5" stroke-dasharray="6,3"/><text x="865" y="406" text-anchor="middle">Bus de eventos</text><text x="865" y="424" text-anchor="middle" font-size="11">futuro</text>

  <g stroke="#333" fill="none" marker-end="url(#a)">
    <path d="M105,102 V170"/><path d="M190,200 H250 V110 H290" stroke-dasharray="6,3"/>
    <path d="M510,136 V170"/><path d="M390,218 V260"/><path d="M390,308 V350"/><path d="M630,308 V350"/>
    <path d="M730,100 H800"/><path d="M800,200 H760 V385 H730" stroke="#c0504d"/><path d="M730,190 H745 V300 H800" stroke-dasharray="6,3"/><path d="M730,400 H765 V410 H800" stroke-dasharray="6,3"/>
  </g>
  <text x="20" y="480" font-weight="bold">Punto crítico: Ingreso crea el resultado y Validación cambia su estado (flecha roja, dato compartido).</text>
  <text x="20" y="500">La decisión modifica estado y registra la decisión en una sola operación atómica (medido en frontera.php).</text>
  <text x="20" y="520">Decisión: monolito modular con API ahora; extraer un servicio solo si se cumplen los disparadores medibles del documento.</text>
</svg>
