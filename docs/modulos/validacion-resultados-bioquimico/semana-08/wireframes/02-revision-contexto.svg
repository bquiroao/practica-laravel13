<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe 2: revisión del resultado y contexto</title>
  <desc id="desc">Pantalla de revisión de la versión pendiente con orden, examen, muestra, valor, ayuda contextual y acciones profesionales.</desc>
  <defs><style>text{font-family:Arial,sans-serif;fill:#172b4d}.small{font-size:13px}.body{font-size:15px}.h{font-size:23px;font-weight:700}.muted{fill:#526581}.line{stroke:#c8d2df;stroke-width:1}.box{fill:#fff;stroke:#c8d2df}.soft{fill:#f3f6fa}.blue{fill:#165d9c}.note{font-size:14px}.badge{fill:#e8f1fb}</style></defs>
  <rect width="1280" height="760" fill="#eef2f7"/><rect x="24" y="20" width="1232" height="54" rx="8" fill="#153956"/><text x="48" y="54" fill="#fff" font-size="20" font-weight="700">HIS · Laboratorio</text><text x="944" y="53" fill="#fff" class="body">Hospital Central</text><circle cx="1178" cy="47" r="17" fill="#dbeafe"/><text x="1172" y="53" class="small" font-weight="700">BQ</text><text x="1202" y="53" fill="#fff" class="small">Perfil bioquímico</text>
  <rect x="24" y="90" width="850" height="638" rx="8" fill="#fff" stroke="#d4dde8"/><text x="50" y="126" class="small blue">← Volver a pendientes</text><text x="50" y="164" class="h">Revisión del resultado</text><rect x="694" y="139" width="150" height="27" rx="13" fill="#fff2cc"/><text x="711" y="158" class="small">Pendiente · v3</text>
  <rect x="50" y="188" width="769" height="47" rx="5" fill="#eaf3fb"/><text x="67" y="208" class="small" font-weight="700">Confirma identidad, orden, examen y muestra antes de decidir.</text><text x="67" y="226" class="small">La evaluación clínica corresponde al bioquímico y al procedimiento aplicable.</text>
  <text x="50" y="271" class="body" font-weight="700">Contexto vinculado</text><rect x="50" y="286" width="369" height="72" rx="5" class="box"/><text x="66" y="310" class="small muted">PACIENTE</text><text x="66" y="338" class="body">P-10284 · Elena R. (mínimo necesario)</text><rect x="432" y="286" width="387" height="72" rx="5" class="box"/><text x="448" y="310" class="small muted">ORDEN / EXAMEN</text><text x="448" y="338" class="body">O-811 · Glucosa sérica</text>
  <rect x="50" y="371" width="369" height="72" rx="5" class="box"/><text x="66" y="395" class="small muted">MUESTRA</text><text x="66" y="423" class="body">M-4401 · suero · recibida</text><rect x="432" y="371" width="387" height="72" rx="5" class="box"/><text x="448" y="395" class="small muted">RESULTADO CAPTURADO</text><text x="448" y="423" class="body">98 mg/dL · versión 3 · 09:14</text>
  <rect x="50" y="458" width="769" height="67" rx="5" fill="#f8fafc" stroke="#c8d2df"/><text x="66" y="484" class="small" font-weight="700">Ayuda contextual · revisión bioquímica</text><text x="66" y="507" class="small muted">Consulta el procedimiento vigente del examen. No se infiere una decisión automática por el valor.</text><text x="770" y="484" class="small blue">Ver ayuda ↗</text>
  <text x="50" y="562" class="small muted">El dato mostrado es de ejemplo. Verifica identidad y asociaciones en la fuente autorizada.</text><rect x="50" y="591" width="190" height="44" rx="5" fill="#165d9c"/><text x="77" y="619" fill="#fff" class="body">Validar resultado</text><rect x="253" y="591" width="190" height="44" rx="5" fill="#fff" stroke="#9aaabd"/><text x="290" y="619" class="body">Rechazar…</text><text x="50" y="663" class="small muted">La decisión registra actor, hospital, versión y fecha/hora.</text>
  <rect x="894" y="90" width="362" height="638" rx="8" fill="#fff" stroke="#d4dde8"/><text x="918" y="128" class="h">Anotaciones UX</text>
  <circle cx="927" cy="166" r="14" class="blue"/><text x="923" y="171" fill="#fff" class="small">1</text><text x="952" y="162" class="note">La barra de regreso conserva la tarea,</text><text x="952" y="181" class="note">no datos clínicos en la dirección web.</text>
  <circle cx="927" cy="226" r="14" class="blue"/><text x="923" y="231" fill="#fff" class="small">2</text><text x="952" y="222" class="note">Versión y estado siempre visibles;</text><text x="952" y="241" class="note">al cambiar, bloquear acción obsoleta.</text>
  <circle cx="927" cy="286" r="14" class="blue"/><text x="923" y="291" fill="#fff" class="small">3</text><text x="952" y="282" class="note">Asociaciones completas son requisito:</text><text x="952" y="301" class="note">orden, examen, muestra y paciente.</text>
  <circle cx="927" cy="346" r="14" class="blue"/><text x="923" y="351" fill="#fff" class="small">4</text><text x="952" y="342" class="note">Mostrar solo datos necesarios; datos</text><text x="952" y="361" class="note">ficticios aquí. No agregar diagnósticos.</text>
  <circle cx="927" cy="406" r="14" class="blue"/><text x="923" y="411" fill="#fff" class="small">5</text><text x="952" y="402" class="note">Ayuda abre procedimiento contextual,</text><text x="952" y="421" class="note">sin sugerir o decidir por el profesional.</text>
  <circle cx="927" cy="466" r="14" class="blue"/><text x="923" y="471" fill="#fff" class="small">6</text><text x="952" y="462" class="note">Una asociación ausente bloquea ambas</text><text x="952" y="481" class="note">acciones y explica cómo escalar.</text>
  <rect x="918" y="526" width="314" height="150" rx="6" class="soft"/><text x="936" y="554" class="body" font-weight="700">Teclado y foco</text><text x="936" y="581" class="small">Orden lógico; botones con verbos claros.</text><text x="936" y="604" class="small">Foco retorna al control que abrió una</text><text x="936" y="627" class="small">ayuda/modal. No depender solo del color.</text><text x="936" y="650" class="small">Contraste y zoom reflow para lectura.</text>
</svg>
