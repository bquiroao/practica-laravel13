<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe 6: error recuperable y conflicto de versión</title>
  <desc id="desc">Vista de conflicto por versión obsoleta y variantes para error de guardado, indisponibilidad y acceso denegado con recuperación segura.</desc>
  <defs><style>text{font-family:Arial,sans-serif;fill:#172b4d}.small{font-size:13px}.body{font-size:15px}.h{font-size:23px;font-weight:700}.muted{fill:#526581}.line{stroke:#c8d2df;stroke-width:1}.box{fill:#fff;stroke:#c8d2df}.soft{fill:#f3f6fa}.blue{fill:#165d9c}.note{font-size:14px}</style></defs>
  <rect width="1280" height="760" fill="#eef2f7"/><rect x="24" y="20" width="1232" height="54" rx="8" fill="#153956"/><text x="48" y="54" fill="#fff" font-size="20" font-weight="700">HIS · Laboratorio</text><text x="944" y="53" fill="#fff" class="body">Hospital Central</text><circle cx="1178" cy="47" r="17" fill="#dbeafe"/><text x="1172" y="53" class="small" font-weight="700">BQ</text><text x="1202" y="53" fill="#fff" class="small">Perfil bioquímico</text>
  <rect x="24" y="90" width="850" height="638" rx="8" fill="#fff" stroke="#d4dde8"/><text x="50" y="132" class="small blue">← Volver a pendientes</text><text x="50" y="171" class="h">Revisión del resultado · R-2048</text><rect x="50" y="194" width="769" height="90" rx="6" fill="#fff4e5" stroke="#e6bd73"/><text x="71" y="224" class="body" font-weight="700">Esta versión ya no está vigente</text><text x="71" y="250" class="small">El resultado cambió mientras lo revisabas. No se registró una decisión.</text><text x="71" y="271" class="small">Recarga la versión actual y vuelve a verificar todo el contexto.</text>
  <rect x="50" y="307" width="369" height="82" rx="5" class="box"/><text x="68" y="333" class="small muted">VERSIÓN QUE ABRISTE</text><text x="68" y="364" class="body">v3 · Pendiente</text><rect x="432" y="307" width="387" height="82" rx="5" class="box"/><text x="450" y="333" class="small muted">ESTADO ACTUAL</text><text x="450" y="364" class="body">Actualizada · requiere recarga</text>
  <rect x="50" y="413" width="212" height="43" rx="5" fill="#165d9c"/><text x="76" y="440" fill="#fff" class="body">Recargar resultado</text><rect x="276" y="413" width="178" height="43" rx="5" fill="#fff" stroke="#9aaabd"/><text x="314" y="440" class="body">Volver a bandeja</text><text x="50" y="493" class="body" font-weight="700">Otros errores y recuperación</text>
  <rect x="50" y="510" width="769" height="51" rx="5" fill="#fff4e5" stroke="#e6bd73"/><text x="67" y="532" class="small" font-weight="700">No se pudo guardar la decisión.</text><text x="67" y="551" class="small">No confirmamos el resultado; revisa el estado antes de reintentar. [Revisar estado]</text>
  <rect x="50" y="573" width="769" height="51" rx="5" fill="#fff4e5" stroke="#e6bd73"/><text x="67" y="595" class="small" font-weight="700">Servicio temporalmente no disponible.</text><text x="67" y="614" class="small">Tu revisión sigue sin confirmar. [Reintentar] · no duplicar la decisión.</text>
  <rect x="50" y="636" width="769" height="51" rx="5" fill="#fcebec" stroke="#e1a6a9"/><text x="67" y="658" class="small" font-weight="700">No tienes acceso a este resultado.</text><text x="67" y="677" class="small">Regresa a tu bandeja autorizada o contacta a soporte. [Volver]</text>
  <rect x="894" y="90" width="362" height="638" rx="8" fill="#fff" stroke="#d4dde8"/><text x="918" y="128" class="h">Anotaciones UX</text>
  <circle cx="927" cy="166" r="14" class="blue"/><text x="923" y="171" fill="#fff" class="small">1</text><text x="952" y="162" class="note">Conflicto no es rechazo ni error</text><text x="952" y="181" class="note">clínico: no se registra decisión.</text>
  <circle cx="927" cy="226" r="14" class="blue"/><text x="923" y="231" fill="#fff" class="small">2</text><text x="952" y="222" class="note">Tras recargar, revisar desde el inicio:</text><text x="952" y="241" class="note">identidad, contexto, valor y versión.</text>
  <circle cx="927" cy="286" r="14" class="blue"/><text x="923" y="291" fill="#fff" class="small">3</text><text x="952" y="282" class="note">Falla incierta: ofrecer verificar estado</text><text x="952" y="301" class="note">antes de repetir para evitar duplicados.</text>
  <circle cx="927" cy="346" r="14" class="blue"/><text x="923" y="351" fill="#fff" class="small">4</text><text x="952" y="342" class="note">Error de autorización no revela si el</text><text x="952" y="361" class="note">resultado existe en otro hospital.</text>
  <circle cx="927" cy="406" r="14" class="blue"/><text x="923" y="411" fill="#fff" class="small">5</text><text x="952" y="402" class="note">Preservar motivo no enviado; no limpiar</text><text x="952" y="421" class="note">formulario en error recuperable.</text>
  <circle cx="927" cy="466" r="14" class="blue"/><text x="923" y="471" fill="#fff" class="small">6</text><text x="952" y="462" class="note">Reintentos limitados y anunciados;</text><text x="952" y="481" class="note">si persiste, escalar con ID técnico.</text>
  <rect x="918" y="526" width="314" height="150" rx="6" class="soft"/><text x="936" y="554" class="body" font-weight="700">No exponer en mensajes</text><text x="936" y="581" class="small">No incluir valores/paciente en consola,</text><text x="936" y="604" class="small">notificación ni reporte a soporte.</text><text x="936" y="627" class="small">Usar referencia técnica; canal clínico</text><text x="936" y="650" class="small">autorizado para contextualizar incidente.</text>
</svg>
