<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe 5: decisión registrada y trazabilidad</title>
  <desc id="desc">Confirmación exitosa de una decisión con audit trail, actor, hospital, versión y hora; enlaces controlados de seguimiento.</desc>
  <defs><style>text{font-family:Arial,sans-serif;fill:#172b4d}.small{font-size:13px}.body{font-size:15px}.h{font-size:23px;font-weight:700}.muted{fill:#526581}.line{stroke:#c8d2df;stroke-width:1}.box{fill:#fff;stroke:#c8d2df}.soft{fill:#f3f6fa}.blue{fill:#165d9c}.note{font-size:14px}</style></defs>
  <rect width="1280" height="760" fill="#eef2f7"/><rect x="24" y="20" width="1232" height="54" rx="8" fill="#153956"/><text x="48" y="54" fill="#fff" font-size="20" font-weight="700">HIS · Laboratorio</text><text x="944" y="53" fill="#fff" class="body">Hospital Central</text><circle cx="1178" cy="47" r="17" fill="#dbeafe"/><text x="1172" y="53" class="small" font-weight="700">BQ</text><text x="1202" y="53" fill="#fff" class="small">Perfil bioquímico</text>
  <rect x="24" y="90" width="850" height="638" rx="8" fill="#fff" stroke="#d4dde8"/><rect x="50" y="113" width="769" height="72" rx="6" fill="#e9f7ef" stroke="#89c99d"/><circle cx="82" cy="149" r="17" fill="#23834a"/><text x="77" y="155" fill="#fff" class="body" font-weight="700">✓</text><text x="112" y="145" class="h">Decisión registrada</text><text x="112" y="168" class="small">Validación guardada correctamente para la versión vigente.</text>
  <text x="50" y="225" class="h">Resultado R-2048</text><rect x="682" y="203" width="137" height="28" rx="14" fill="#e9f7ef"/><text x="704" y="222" class="small">Validado</text><rect x="50" y="245" width="769" height="88" rx="5" class="box"/><text x="68" y="271" class="small muted">EXAMEN / RESULTADO</text><text x="68" y="300" class="body" font-weight="700">Glucosa sérica · 98 mg/dL</text><text x="497" y="271" class="small muted">VERSIÓN / MUESTRA</text><text x="497" y="300" class="body">v3 · M-4401</text>
  <text x="50" y="373" class="body" font-weight="700">Registro de trazabilidad</text><rect x="50" y="389" width="769" height="169" rx="5" fill="#f8fafc" stroke="#d4dde8"/><text x="70" y="421" class="small muted">DECISIÓN</text><text x="230" y="421" class="body">Validación profesional</text><line x1="70" y1="434" x2="799" y2="434" class="line"/><text x="70" y="461" class="small muted">ACTOR</text><text x="230" y="461" class="body">Bioquímico autenticado · ID BQ-028</text>
  <line x1="70" y1="474" x2="799" y2="474" class="line"/><text x="70" y="501" class="small muted">HOSPITAL</text><text x="230" y="501" class="body">Hospital Central</text><line x1="70" y1="514" x2="799" y2="514" class="line"/><text x="70" y="541" class="small muted">FECHA / HORA</text><text x="230" y="541" class="body">25 oct 2026 · 10:42 (hora del servidor)</text>
  <rect x="50" y="576" width="769" height="49" rx="5" fill="#eaf3fb"/><text x="68" y="606" class="small">La decisión conserva la versión revisada; el valor no se modifica.</text><rect x="50" y="650" width="176" height="40" rx="5" fill="#165d9c"/><text x="80" y="675" fill="#fff" class="body">Volver a pendientes</text><text x="252" y="675" class="small blue">Abrir siguiente resultado →</text>
  <rect x="894" y="90" width="362" height="638" rx="8" fill="#fff" stroke="#d4dde8"/><text x="918" y="128" class="h">Anotaciones UX</text>
  <circle cx="927" cy="166" r="14" class="blue"/><text x="923" y="171" fill="#fff" class="small">1</text><text x="952" y="162" class="note">Éxito solo después de persistencia</text><text x="952" y="181" class="note">confirmada; no optimismo visual.</text>
  <circle cx="927" cy="226" r="14" class="blue"/><text x="923" y="231" fill="#fff" class="small">2</text><text x="952" y="222" class="note">Mostrar actor, hospital, decisión,</text><text x="952" y="241" class="note">versión y hora para verificación.</text>
  <circle cx="927" cy="286" r="14" class="blue"/><text x="923" y="291" fill="#fff" class="small">3</text><text x="952" y="282" class="note">No llamar «firma digital» a esta</text><text x="952" y="301" class="note">trazabilidad; no certifica identidad legal.</text>
  <circle cx="927" cy="346" r="14" class="blue"/><text x="923" y="351" fill="#fff" class="small">4</text><text x="952" y="342" class="note">Si es rechazo, mismo patrón de éxito</text><text x="952" y="361" class="note">y motivo solo visible con autorización.</text>
  <circle cx="927" cy="406" r="14" class="blue"/><text x="923" y="411" fill="#fff" class="small">5</text><text x="952" y="402" class="note">Siguiente resultado requiere abrirlo y</text><text x="952" y="421" class="note">volver a revisar, sin decisión rápida.</text>
  <circle cx="927" cy="466" r="14" class="blue"/><text x="923" y="471" fill="#fff" class="small">6</text><text x="952" y="462" class="note">Error de guardar nunca conduce aquí;</text><text x="952" y="481" class="note">nunca afirmar éxito sin recibo.</text>
  <rect x="918" y="526" width="314" height="150" rx="6" class="soft"/><text x="936" y="554" class="body" font-weight="700">Retorno seguro</text><text x="936" y="581" class="small">Volver limpia filtros/selección sensible</text><text x="936" y="604" class="small">según política de sesión; no mostrar</text><text x="936" y="627" class="small">datos clínicos en alertas del sistema.</text><text x="936" y="650" class="small">Mantener auditoría con acceso restringido.</text>
</svg>
