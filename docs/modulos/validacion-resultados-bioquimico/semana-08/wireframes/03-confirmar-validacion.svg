<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe 3: confirmar validación</title>
  <desc id="desc">Diálogo de confirmación previo a validar una versión pendiente; resume resultado, actor, hospital y carácter irreversible.</desc>
  <defs><style>text{font-family:Arial,sans-serif;fill:#172b4d}.small{font-size:13px}.body{font-size:15px}.h{font-size:23px;font-weight:700}.muted{fill:#526581}.line{stroke:#c8d2df;stroke-width:1}.box{fill:#fff;stroke:#c8d2df}.soft{fill:#f3f6fa}.blue{fill:#165d9c}.note{font-size:14px}</style></defs>
  <rect width="1280" height="760" fill="#eef2f7"/><rect x="24" y="20" width="1232" height="54" rx="8" fill="#153956"/><text x="48" y="54" fill="#fff" font-size="20" font-weight="700">HIS · Laboratorio</text><text x="944" y="53" fill="#fff" class="body">Hospital Central</text><circle cx="1178" cy="47" r="17" fill="#dbeafe"/><text x="1172" y="53" class="small" font-weight="700">BQ</text><text x="1202" y="53" fill="#fff" class="small">Perfil bioquímico</text>
  <rect x="24" y="90" width="850" height="638" rx="8" fill="#fff" stroke="#d4dde8"/><text x="50" y="132" class="small blue">← Volver a pendientes</text><text x="50" y="171" class="h">Revisión del resultado · R-2048</text><rect x="50" y="194" width="769" height="51" rx="5" fill="#f8fafc" stroke="#d4dde8"/><text x="68" y="216" class="small muted">Glucosa sérica · 98 mg/dL · Muestra M-4401 · versión 3</text><text x="68" y="235" class="small">Estado actual: Pendiente</text>
  <rect x="150" y="263" width="574" height="371" rx="10" fill="#fff" stroke="#8fa3b8" stroke-width="2"/><rect x="150" y="263" width="574" height="58" rx="10" fill="#eaf3fb"/><text x="180" y="300" class="h">Confirmar validación</text><text x="180" y="354" class="body">¿Confirmas validar esta versión del resultado?</text><text x="180" y="384" class="small muted">La decisión quedará asociada a tu usuario y al hospital activo.</text>
  <rect x="180" y="411" width="514" height="83" rx="5" class="soft"/><text x="198" y="439" class="small" font-weight="700">Se registrará</text><text x="198" y="462" class="small">Resultado R-2048 · versión 3 · Hospital Central</text><text x="198" y="482" class="small">Acción: validar · Actor: perfil bioquímico · fecha/hora del sistema</text>
  <rect x="180" y="514" width="514" height="51" rx="5" fill="#fff7e6" stroke="#e4c778"/><text x="197" y="536" class="small" font-weight="700">La versión validada no se edita desde este flujo.</text><text x="197" y="555" class="small">Una rectificación posterior requiere un proceso controlado aparte.</text>
  <rect x="393" y="584" width="132" height="38" rx="5" fill="#fff" stroke="#9aaabd"/><text x="421" y="608" class="body">Cancelar</text><rect x="538" y="584" width="156" height="38" rx="5" fill="#165d9c"/><text x="556" y="608" fill="#fff" class="body">Confirmar</text>
  <rect x="894" y="90" width="362" height="638" rx="8" fill="#fff" stroke="#d4dde8"/><text x="918" y="128" class="h">Anotaciones UX</text>
  <circle cx="927" cy="166" r="14" class="blue"/><text x="923" y="171" fill="#fff" class="small">1</text><text x="952" y="162" class="note">Confirmación explícita evita validar</text><text x="952" y="181" class="note">con un clic accidental.</text>
  <circle cx="927" cy="226" r="14" class="blue"/><text x="923" y="231" fill="#fff" class="small">2</text><text x="952" y="222" class="note">Resume ID, versión y hospital para</text><text x="952" y="241" class="note">detectar contexto incorrecto.</text>
  <circle cx="927" cy="286" r="14" class="blue"/><text x="923" y="291" fill="#fff" class="small">3</text><text x="952" y="282" class="note">Si cambió estado/versión, no confirmar:</text><text x="952" y="301" class="note">mostrar conflicto y pedir recarga.</text>
  <circle cx="927" cy="346" r="14" class="blue"/><text x="923" y="351" fill="#fff" class="small">4</text><text x="952" y="342" class="note">Al confirmar: bloquear botón, mostrar</text><text x="952" y="361" class="note">“Guardando…” y evitar doble envío.</text>
  <circle cx="927" cy="406" r="14" class="blue"/><text x="923" y="411" fill="#fff" class="small">5</text><text x="952" y="402" class="note">Solo éxito confirmado muestra estado</text><text x="952" y="421" class="note">Validado y pasa a pantalla 5.</text>
  <circle cx="927" cy="466" r="14" class="blue"/><text x="923" y="471" fill="#fff" class="small">6</text><text x="952" y="462" class="note">Cancelar cierra y devuelve el foco al</text><text x="952" y="481" class="note">botón Validar resultado.</text>
  <rect x="918" y="526" width="314" height="150" rx="6" class="soft"/><text x="936" y="554" class="body" font-weight="700">Regla de confirmación</text><text x="936" y="581" class="small">No pedir reescribir datos clínicos ni</text><text x="936" y="604" class="small">contraseña en pantalla compartida.</text><text x="936" y="627" class="small">Si expira sesión, no enviar decisión;</text><text x="936" y="650" class="small">redirigir a acceso sin filtrar contexto.</text>
</svg>
