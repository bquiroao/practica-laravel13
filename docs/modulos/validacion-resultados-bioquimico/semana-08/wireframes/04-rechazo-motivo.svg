<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe 4: rechazo con motivo obligatorio</title>
  <desc id="desc">Diálogo de rechazo con campo de motivo, estado vacío y validación en línea; conserva el resultado sin borrarlo.</desc>
  <defs><style>text{font-family:Arial,sans-serif;fill:#172b4d}.small{font-size:13px}.body{font-size:15px}.h{font-size:23px;font-weight:700}.muted{fill:#526581}.line{stroke:#c8d2df;stroke-width:1}.box{fill:#fff;stroke:#c8d2df}.soft{fill:#f3f6fa}.blue{fill:#165d9c}.note{font-size:14px}</style></defs>
  <rect width="1280" height="760" fill="#eef2f7"/><rect x="24" y="20" width="1232" height="54" rx="8" fill="#153956"/><text x="48" y="54" fill="#fff" font-size="20" font-weight="700">HIS · Laboratorio</text><text x="944" y="53" fill="#fff" class="body">Hospital Central</text><circle cx="1178" cy="47" r="17" fill="#dbeafe"/><text x="1172" y="53" class="small" font-weight="700">BQ</text><text x="1202" y="53" fill="#fff" class="small">Perfil bioquímico</text>
  <rect x="24" y="90" width="850" height="638" rx="8" fill="#fff" stroke="#d4dde8"/><text x="50" y="132" class="small blue">← Volver a pendientes</text><text x="50" y="171" class="h">Revisión del resultado · R-2048</text><rect x="50" y="194" width="769" height="51" rx="5" fill="#f8fafc" stroke="#d4dde8"/><text x="68" y="216" class="small muted">Glucosa sérica · 98 mg/dL · Muestra M-4401 · versión 3</text><text x="68" y="235" class="small">Estado actual: Pendiente</text>
  <rect x="150" y="263" width="574" height="440" rx="10" fill="#fff" stroke="#8fa3b8" stroke-width="2"/><rect x="150" y="263" width="574" height="58" rx="10" fill="#fff2ed"/><text x="180" y="300" class="h">Rechazar resultado</text><text x="180" y="354" class="body">Indica el motivo de la decisión.</text><text x="180" y="379" class="small muted">El motivo queda en la trazabilidad y orienta el seguimiento.</text>
  <text x="180" y="418" class="small" font-weight="700">Motivo <tspan fill="#b42318">· obligatorio</tspan></text><rect x="180" y="432" width="514" height="111" rx="5" fill="#fff" stroke="#b42318" stroke-width="2"/><text x="198" y="461" class="body muted">Describe el hallazgo que requiere revisión…</text><line x1="180" y1="555" x2="694" y2="555" stroke="#b42318" stroke-width="2"/><text x="180" y="578" font-size="13" fill="#b42318">Escribe un motivo para continuar.</text>
  <rect x="180" y="594" width="514" height="40" rx="5" fill="#f8fafc"/><text x="197" y="619" class="small">El resultado original se conserva para seguimiento.</text><rect x="393" y="649" width="132" height="38" rx="5" fill="#fff" stroke="#9aaabd"/><text x="421" y="673" class="body">Cancelar</text><rect x="538" y="649" width="156" height="38" rx="5" fill="#a9b4c1"/><text x="556" y="673" fill="#fff" class="body">Confirmar</text>
  <rect x="894" y="90" width="362" height="638" rx="8" fill="#fff" stroke="#d4dde8"/><text x="918" y="128" class="h">Anotaciones UX</text>
  <circle cx="927" cy="166" r="14" class="blue"/><text x="923" y="171" fill="#fff" class="small">1</text><text x="952" y="162" class="note">Motivo obligatorio: validar entrada</text><text x="952" y="181" class="note">recortando espacios; no aceptar vacío.</text>
  <circle cx="927" cy="226" r="14" class="blue"/><text x="923" y="231" fill="#fff" class="small">2</text><text x="952" y="222" class="note">Al enviar vacío, foco al campo y texto</text><text x="952" y="241" class="note">asociado; no borrar lo ya escrito.</text>
  <circle cx="927" cy="286" r="14" class="blue"/><text x="923" y="291" fill="#fff" class="small">3</text><text x="952" y="282" class="note">No imponer códigos clínicos ni razones</text><text x="952" y="301" class="note">preseleccionadas no aprobadas.</text>
  <circle cx="927" cy="346" r="14" class="blue"/><text x="923" y="351" fill="#fff" class="small">4</text><text x="952" y="342" class="note">No se especifica máximo aquí; si luego</text><text x="952" y="361" class="note">se acuerda, avisar límite antes de enviar.</text>
  <circle cx="927" cy="406" r="14" class="blue"/><text x="923" y="411" fill="#fff" class="small">5</text><text x="952" y="402" class="note">Tras enviar, bloquear doble clic; fallo</text><text x="952" y="421" class="note">recuperable conserva el texto del motivo.</text>
  <circle cx="927" cy="466" r="14" class="blue"/><text x="923" y="471" fill="#fff" class="small">6</text><text x="952" y="462" class="note">Cancelar no guarda ni cambia estado;</text><text x="952" y="481" class="note">alertar si hay texto sin guardar.</text>
  <rect x="918" y="526" width="314" height="150" rx="6" class="soft"/><text x="936" y="554" class="body" font-weight="700">Privacidad del motivo</text><text x="936" y="581" class="small">No mostrar motivo en bandeja, URL,</text><text x="936" y="604" class="small">notificación general ni analítica abierta.</text><text x="936" y="627" class="small">Acceso solo por rol y necesidad de</text><text x="936" y="650" class="small">seguimiento autorizada.</text>
</svg>
