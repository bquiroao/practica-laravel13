<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe 1: bandeja de resultados pendientes</title>
  <desc id="desc">Bandeja hospitalaria para bioquímicos autorizados, con filtros, tabla de resultados, estados de carga y vacío, y anotaciones UX.</desc>
  <defs><style>text{font-family:Arial,sans-serif;fill:#172b4d}.small{font-size:13px}.body{font-size:15px}.h{font-size:23px;font-weight:700}.muted{fill:#526581}.line{stroke:#c8d2df;stroke-width:1}.box{fill:#fff;stroke:#c8d2df}.soft{fill:#f3f6fa}.blue{fill:#165d9c}.note{font-size:14px}.badge{fill:#e8f1fb}</style></defs>
  <rect width="1280" height="760" fill="#eef2f7"/><rect x="24" y="20" width="1232" height="54" rx="8" fill="#153956"/><text x="48" y="54" fill="#fff" font-size="20" font-weight="700">HIS · Laboratorio</text><text x="944" y="53" fill="#fff" class="body">Hospital Central</text><circle cx="1178" cy="47" r="17" fill="#dbeafe"/><text x="1172" y="53" class="small" font-weight="700">BQ</text><text x="1202" y="53" fill="#fff" class="small">Perfil bioquímico</text>
  <rect x="24" y="90" width="850" height="638" rx="8" fill="#fff" stroke="#d4dde8"/><text x="50" y="129" class="h">Resultados pendientes</text><rect x="699" y="105" width="145" height="28" rx="14" class="badge"/><text x="715" y="124" class="small">Rol: bioquímico</text><text x="50" y="158" class="small muted">Revisa el contexto y la versión vigente antes de decidir.</text>
  <rect x="50" y="180" width="295" height="40" rx="5" class="box"/><text x="64" y="205" class="body muted">Buscar ID de resultado</text><rect x="357" y="180" width="205" height="40" rx="5" class="box"/><text x="371" y="205" class="body">Estado: Pendiente ▾</text><rect x="574" y="180" width="245" height="40" rx="5" class="box"/><text x="588" y="205" class="body">Ordenar: más antiguo ▾</text>
  <rect x="50" y="239" width="769" height="38" fill="#f3f6fa"/><text x="64" y="263" class="small" font-weight="700">RESULTADO / EXAMEN</text><text x="352" y="263" class="small" font-weight="700">MUESTRA</text><text x="495" y="263" class="small" font-weight="700">INGRESO</text><text x="653" y="263" class="small" font-weight="700">ESTADO</text><line x1="50" y1="277" x2="819" y2="277" class="line"/>
  <rect x="51" y="278" width="768" height="65" fill="#f7fbff"/><text x="64" y="304" class="body" font-weight="700">R-2048 · Glucosa</text><text x="64" y="326" class="small muted">Orden O-811 · versión 3</text><text x="352" y="313" class="body">M-4401</text><text x="495" y="313" class="small">Hoy, 09:14</text><rect x="652" y="294" width="83" height="25" rx="12" fill="#fff2cc"/><text x="666" y="311" class="small">Pendiente</text><text x="753" y="312" class="small blue">Abrir →</text>
  <line x1="50" y1="344" x2="819" y2="344" class="line"/><text x="64" y="371" class="body">R-2045 · Perfil lipídico</text><text x="64" y="393" class="small muted">Orden O-806 · versión 1</text><text x="352" y="380" class="body">M-4390</text><text x="495" y="380" class="small">Hoy, 08:52</text><rect x="652" y="361" width="83" height="25" rx="12" fill="#fff2cc"/><text x="666" y="378" class="small">Pendiente</text><text x="753" y="379" class="small blue">Abrir →</text>
  <line x1="50" y1="411" x2="819" y2="411" class="line"/><text x="64" y="438" class="body">R-2039 · Creatinina</text><text x="64" y="460" class="small muted">Orden O-799 · versión 2</text><text x="352" y="447" class="body">M-4372</text><text x="495" y="447" class="small">Ayer, 16:21</text><rect x="652" y="428" width="83" height="25" rx="12" fill="#fff2cc"/><text x="666" y="445" class="small">Pendiente</text><text x="753" y="446" class="small blue">Abrir →</text>
  <line x1="50" y1="478" x2="819" y2="478" class="line"/><text x="50" y="514" class="small muted">Mostrando 1–3 · la lista respeta el hospital autorizado.</text>
  <rect x="50" y="549" width="769" height="54" rx="5" fill="#f8fafc" stroke="#d7e0ea"/><text x="66" y="572" class="small" font-weight="700">Estados alternativos</text><text x="66" y="591" class="small muted">Carga: filas esqueleto · Vacía: “No hay resultados pendientes” · Error: mensaje y Reintentar</text>
  <rect x="894" y="90" width="362" height="638" rx="8" fill="#fff" stroke="#d4dde8"/><text x="918" y="128" class="h">Anotaciones UX</text>
  <circle cx="927" cy="166" r="14" class="blue"/><text x="923" y="171" fill="#fff" class="small">1</text><text x="952" y="162" class="note">Acceso solo con sesión autenticada,</text><text x="952" y="181" class="note">rol y ámbito hospitalario vigentes.</text>
  <circle cx="927" cy="226" r="14" class="blue"/><text x="923" y="231" fill="#fff" class="small">2</text><text x="952" y="222" class="note">Filtros no muestran pacientes ni datos</text><text x="952" y="241" class="note">sensibles en resultados de búsqueda.</text>
  <circle cx="927" cy="286" r="14" class="blue"/><text x="923" y="291" fill="#fff" class="small">3</text><text x="952" y="282" class="note">ID, examen, muestra, antigüedad y</text><text x="952" y="301" class="note">estado permiten priorizar la revisión.</text>
  <circle cx="927" cy="346" r="14" class="blue"/><text x="923" y="351" fill="#fff" class="small">4</text><text x="952" y="342" class="note">Toda fila abre el detalle; no se decide</text><text x="952" y="361" class="note">desde la lista para evitar errores.</text>
  <circle cx="927" cy="406" r="14" class="blue"/><text x="923" y="411" fill="#fff" class="small">5</text><text x="952" y="402" class="note">Vacío, carga y error son estados</text><text x="952" y="421" class="note">distintos; nunca simulan éxito.</text>
  <circle cx="927" cy="466" r="14" class="blue"/><text x="923" y="471" fill="#fff" class="small">6</text><text x="952" y="462" class="note">Teclado: filtros → filas → Abrir;</text><text x="952" y="481" class="note">foco visible y nombres accesibles.</text>
  <rect x="918" y="526" width="314" height="150" rx="6" class="soft"/><text x="936" y="554" class="body" font-weight="700">Regla de privacidad</text><text x="936" y="581" class="small">El hospital activo se muestra siempre.</text><text x="936" y="604" class="small">Cambiar de hospital exige autorización</text><text x="936" y="627" class="small">explícita y recarga de la bandeja.</text><text x="936" y="650" class="small">No se guarda contexto clínico en URL.</text>
</svg>
