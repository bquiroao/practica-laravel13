<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc"><title id="title">Recuperar sin datos ambiguos</title><desc id="desc">Wireframe anotado estático de evaluación NativePHP. Datos ficticios; no runtime ejecutado.</desc><rect width="1100" height="700" fill="#f2f6f7"/><rect width="1100" height="76" fill="#153e49"/><g font-family="Arial,sans-serif"><text x="28" y="34" fill="white" font-size="18" font-weight="bold">HIS / EVALUACIÓN DE EXTENSIÓN NATIVA</text><text x="28" y="59" fill="#d0e2e6" font-size="14">Hospital H-01 · Experimento acotado · Sesión demo</text><text x="28" y="122" fill="#193c46" font-size="25" font-weight="bold">Recuperar sin datos ambiguos</text><rect x="28" y="150" width="690" height="432" rx="12" fill="white" stroke="#cbd9dd"/><text x="756" y="178" fill="#193c46" font-size="17" font-weight="bold">ANOTACIONES UX</text><text x="48" y="188" fill="#243f47" font-size="16">HIS no disponible · No se obtuvo una lectura actual</text><text x="48" y="222" fill="#243f47" font-size="16">Última lectura demo: PENDIENTE</text><text x="48" y="256" fill="#243f47" font-size="16">28 oct 2026, 11:50 Guatemala · OBSOLETA</text><text x="48" y="290" fill="#243f47" font-size="16">Notificación: no intentada</text><text x="48" y="324" fill="#243f47" font-size="16"></text><text x="48" y="358" fill="#243f47" font-size="16">Al recuperar conexión, volver a consultar.</text><text x="48" y="392" fill="#243f47" font-size="16">Sin lectura previa: mostrar Sin dato, no inventar estado.</text><text x="48" y="426" fill="#243f47" font-size="16">Permiso denegado: revisar ajustes, sin bucle de solicitud.</text><text x="48" y="460" fill="#243f47" font-size="16">Un fallo no se presenta como consulta actual exitosa.</text><text x="756" y="216" fill="#3c5962" font-size="15">1. Snapshot solo de la misma</text><text x="756" y="246" fill="#3c5962" font-size="15">   orden y hospital autorizados.</text><text x="756" y="276" fill="#3c5962" font-size="15">2. No notificar dato obsoleto.</text><text x="756" y="306" fill="#3c5962" font-size="15">3. No hay cola de escritura.</text><text x="756" y="336" fill="#3c5962" font-size="15">4. Conservar entrada en memoria.</text><text x="756" y="366" fill="#3c5962" font-size="15">5. Reintento manual, sin duplicar</text><text x="756" y="396" fill="#3c5962" font-size="15">   notificación automáticamente.</text><rect x="28" y="606" width="420" height="48" rx="8" fill="#126574"/><text x="48" y="637" fill="white" font-size="17">Reintentar consulta</text><text x="756" y="637" fill="#526b73" font-size="14">Propuesta estática · Semana 8</text></g></svg>