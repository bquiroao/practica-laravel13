<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc"><title id="title">Consulta y capacidad separadas</title><desc id="desc">Wireframe anotado estático de evaluación NativePHP. Datos ficticios; no runtime ejecutado.</desc><rect width="1100" height="700" fill="#f2f6f7"/><rect width="1100" height="76" fill="#153e49"/><g font-family="Arial,sans-serif"><text x="28" y="34" fill="white" font-size="18" font-weight="bold">HIS / EVALUACIÓN DE EXTENSIÓN NATIVA</text><text x="28" y="59" fill="#d0e2e6" font-size="14">Hospital H-01 · Experimento acotado · Sesión demo</text><text x="28" y="122" fill="#193c46" font-size="25" font-weight="bold">Consulta y capacidad separadas</text><rect x="28" y="150" width="690" height="432" rx="12" fill="white" stroke="#cbd9dd"/><text x="756" y="178" fill="#193c46" font-size="17" font-weight="bold">ANOTACIONES UX</text><text x="48" y="188" fill="#243f47" font-size="16">Experimento E-DEMO-01 · Orden ficticia DEMO-1</text><text x="48" y="222" fill="#243f47" font-size="16">Consulta: confirmada en demostración</text><text x="48" y="256" fill="#243f47" font-size="16">Estado de orden: PENDIENTE · Fuente HIS demo</text><text x="48" y="290" fill="#243f47" font-size="16">Lectura: 28 oct 2026, 12:00 Guatemala</text><text x="48" y="324" fill="#243f47" font-size="16">Notificación: enviada en simulación</text><text x="48" y="358" fill="#243f47" font-size="16"></text><text x="48" y="392" fill="#243f47" font-size="16">Mensaje: Consulta finalizada: PENDIENTE</text><text x="48" y="426" fill="#243f47" font-size="16">Viabilidad nativa: NO DEMOSTRADA</text><text x="48" y="460" fill="#243f47" font-size="16">No se modifica el estado de la orden.</text><text x="756" y="216" fill="#3c5962" font-size="15">1. Éxito de consulta no certifica</text><text x="756" y="246" fill="#3c5962" font-size="15">   notificación ni plataforma.</text><text x="756" y="276" fill="#3c5962" font-size="15">2. Fuente/hora siempre visibles.</text><text x="756" y="306" fill="#3c5962" font-size="15">3. Permiso denegado conserva</text><text x="756" y="336" fill="#3c5962" font-size="15">   consulta y muestra No enviada.</text><text x="756" y="366" fill="#3c5962" font-size="15">4. No hay éxito antes de respuesta.</text><rect x="28" y="606" width="420" height="48" rx="8" fill="#126574"/><text x="48" y="637" fill="white" font-size="17">Ver evidencia y limitaciones</text><text x="756" y="637" fill="#526b73" font-size="14">Propuesta estática · Semana 8</text></g></svg>