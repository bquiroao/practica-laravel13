<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc"><title id="title">Confirmar experimento acotado</title><desc id="desc">Wireframe anotado estático de evaluación NativePHP. Datos ficticios; no runtime ejecutado.</desc><rect width="1100" height="700" fill="#f2f6f7"/><rect width="1100" height="76" fill="#153e49"/><g font-family="Arial,sans-serif"><text x="28" y="34" fill="white" font-size="18" font-weight="bold">HIS / EVALUACIÓN DE EXTENSIÓN NATIVA</text><text x="28" y="59" fill="#d0e2e6" font-size="14">Hospital H-01 · Experimento acotado · Sesión demo</text><text x="28" y="122" fill="#193c46" font-size="25" font-weight="bold">Confirmar experimento acotado</text><rect x="28" y="150" width="690" height="432" rx="12" fill="white" stroke="#cbd9dd"/><text x="756" y="178" fill="#193c46" font-size="17" font-weight="bold">ANOTACIONES UX</text><text x="48" y="188" fill="#243f47" font-size="16">Hospital H-01 · Destino escritorio demo</text><text x="48" y="222" fill="#243f47" font-size="16">Orden ficticia DEMO-1 · Solo lectura</text><text x="48" y="256" fill="#243f47" font-size="16">Capacidad: Notificación de estado genérico</text><text x="48" y="290" fill="#243f47" font-size="16"></text><text x="48" y="324" fill="#243f47" font-size="16">Se consultará el HIS demo y se intentará notificar.</text><text x="48" y="358" fill="#243f47" font-size="16">No se enviará ID ni datos clínicos en la notificación.</text><text x="48" y="392" fill="#243f47" font-size="16">Runtime pendiente: viabilidad nativa no demostrada.</text><text x="48" y="426" fill="#243f47" font-size="16"></text><text x="48" y="460" fill="#243f47" font-size="16">← Volver conserva configuración sin ejecutar</text><text x="756" y="216" fill="#3c5962" font-size="15">1. Revisar antes de ejecutar.</text><text x="756" y="246" fill="#3c5962" font-size="15">2. Confirmar bloquea doble envío.</text><text x="756" y="276" fill="#3c5962" font-size="15">3. Permisos se solicitan solo</text><text x="756" y="306" fill="#3c5962" font-size="15">   al usar capacidad real.</text><text x="756" y="336" fill="#3c5962" font-size="15">4. Cancelar no consulta ni notifica.</text><rect x="28" y="606" width="420" height="48" rx="8" fill="#126574"/><text x="48" y="637" fill="white" font-size="17">Ejecutar demostración</text><text x="756" y="637" fill="#526b73" font-size="14">Propuesta estática · Semana 8</text></g></svg>