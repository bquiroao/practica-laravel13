<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc"><title id="title">Evidencia y decisión de viabilidad</title><desc id="desc">Wireframe anotado estático de evaluación NativePHP. Datos ficticios; no runtime ejecutado.</desc><rect width="1100" height="700" fill="#f2f6f7"/><rect width="1100" height="76" fill="#153e49"/><g font-family="Arial,sans-serif"><text x="28" y="34" fill="white" font-size="18" font-weight="bold">HIS / EVALUACIÓN DE EXTENSIÓN NATIVA</text><text x="28" y="59" fill="#d0e2e6" font-size="14">Hospital H-01 · Experimento acotado · Sesión demo</text><text x="28" y="122" fill="#193c46" font-size="25" font-weight="bold">Evidencia y decisión de viabilidad</text><rect x="28" y="150" width="690" height="432" rx="12" fill="white" stroke="#cbd9dd"/><text x="756" y="178" fill="#193c46" font-size="17" font-weight="bold">ANOTACIONES UX</text><text x="48" y="188" fill="#243f47" font-size="16">E-DEMO-01 · Evaluadora DEMO · Hospital H-01</text><text x="48" y="222" fill="#243f47" font-size="16">Destino: escritorio demo · Datos ficticios</text><text x="48" y="256" fill="#243f47" font-size="16">Contrato consulta/notificación: demostrado con dobles</text><text x="48" y="290" fill="#243f47" font-size="16">Runtime / permisos del SO / empaquetado: pendientes</text><text x="48" y="324" fill="#243f47" font-size="16"></text><text x="48" y="358" fill="#243f47" font-size="16">Conclusión: viabilidad nativa no demostrada</text><text x="48" y="392" fill="#243f47" font-size="16">Fuente de verdad: HIS · Sin escritura offline</text><text x="48" y="426" fill="#243f47" font-size="16">Riesgos: plataforma, permisos, red y almacenamiento</text><text x="48" y="460" fill="#243f47" font-size="16">Exportar solo evidencia técnica sin datos clínicos.</text><text x="756" y="216" fill="#3c5962" font-size="15">1. Revisor autorizado ve evidencia</text><text x="756" y="246" fill="#3c5962" font-size="15">   sin modificar ni repetir efectos.</text><text x="756" y="276" fill="#3c5962" font-size="15">2. Exportar requiere permiso propio.</text><text x="756" y="306" fill="#3c5962" font-size="15">3. Fallo de evidencia no revierte</text><text x="756" y="336" fill="#3c5962" font-size="15">   consulta ni reenvía notificación.</text><text x="756" y="366" fill="#3c5962" font-size="15">4. No aprobar un destino a partir</text><text x="756" y="396" fill="#3c5962" font-size="15">   de resultados de otro destino.</text><rect x="28" y="606" width="420" height="48" rx="8" fill="#126574"/><text x="48" y="637" fill="white" font-size="17">Volver a evaluaciones</text><text x="756" y="637" fill="#526b73" font-size="14">Propuesta estática · Semana 8</text></g></svg>