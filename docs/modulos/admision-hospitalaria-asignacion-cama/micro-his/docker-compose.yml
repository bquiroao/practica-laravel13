# PostgreSQL 16 del Micro-HIS «Admisión hospitalaria y asignación de cama».
# Solo datos ficticios. La contraseña es de uso local y no protege nada real.
# Puerto 55443 (55440, 55441, 55442, 5433, 55431 y 55433 ya están ocupados).
services:
  postgres-admision:
    image: postgres:16
    container_name: micro-his-admision-pg
    environment:
      POSTGRES_USER: admision
      POSTGRES_PASSWORD: admision_local
      POSTGRES_DB: micro_admision
    ports:
      - "55443:5432"
    volumes:
      - datos-admision:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admision -d micro_admision"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  datos-admision:
