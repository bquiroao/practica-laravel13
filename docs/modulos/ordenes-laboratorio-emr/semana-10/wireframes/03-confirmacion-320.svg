<svg xmlns="http://www.w3.org/2000/svg" width="320" height="790" viewBox="0 0 320 790" role="img" aria-labelledby="title desc"><title id="title">Confirmar orden</title><desc id="desc">Wireframe móvil estático de 320 px, datos ficticios y estados de demostración.</desc><rect width="100%" height="100%" fill="#f2f6f7"/><rect width="100%" height="88" fill="#143e49"/><g font-family="Arial,sans-serif"><text x="16" y="30" fill="white" font-size="15" font-weight="bold">HIS / ÓRDENES DESDE EMR</text><text x="16" y="59" fill="#d2e6e8" font-size="13">H-01 · Sesión autorizada de demo</text><text x="16" y="132" fill="#193c46" font-size="21" font-weight="bold">Confirmar orden</text><rect x="16" y="160" width="288" height="470" rx="12" fill="white" stroke="#cbd9dd"/><text x="28" y="192" fill="#243f47" font-size="14">Paciente DEMO-001 · EP-01</text><text x="28" y="226" fill="#243f47" font-size="14">Hospital H-01 · Emisor DEMO</text><text x="28" y="260" fill="#243f47" font-size="14"></text><text x="28" y="294" fill="#243f47" font-size="14">2 pruebas solicitadas:</text><text x="28" y="328" fill="#243f47" font-size="14">P1 · Glucosa demo</text><text x="28" y="362" fill="#243f47" font-size="14">P2 · Hemograma demo</text><text x="28" y="396" fill="#243f47" font-size="14"></text><text x="28" y="430" fill="#243f47" font-size="14">Orden y partidas se guardan juntas.</text><text x="28" y="464" fill="#243f47" font-size="14">No confirma muestra ni resultado.</text><text x="28" y="498" fill="#243f47" font-size="14">← Editar conserva selección</text><text x="28" y="532" fill="#243f47" font-size="14">Cancelar no crea una orden.</text><rect x="16" y="650" width="288" height="48" rx="8" fill="#126574"/><text x="160" y="680" text-anchor="middle" fill="white" font-size="15">Confirmar emisión</text><text x="16" y="735" fill="#526b73" font-size="12">Datos ficticios · Wireframe 320 px</text><text x="16" y="759" fill="#526b73" font-size="12">Semana 10 · Desplazamiento vertical</text></g></svg>