<svg xmlns="http://www.w3.org/2000/svg" width="375" height="790" viewBox="0 0 375 790" role="img" aria-labelledby="title desc"><title id="title">Comprobar emisión</title><desc id="desc">Wireframe móvil estático de 375 px, datos ficticios y estados de demostración.</desc><rect width="100%" height="100%" fill="#f2f6f7"/><rect width="100%" height="88" fill="#143e49"/><g font-family="Arial,sans-serif"><text x="16" y="30" fill="white" font-size="15" font-weight="bold">HIS / ÓRDENES DESDE EMR</text><text x="16" y="59" fill="#d2e6e8" font-size="13">H-01 · Sesión autorizada de demo</text><text x="16" y="132" fill="#193c46" font-size="21" font-weight="bold">Comprobar emisión</text><rect x="16" y="160" width="343" height="470" rx="12" fill="white" stroke="#cbd9dd"/><text x="28" y="192" fill="#243f47" font-size="14">La respuesta no llegó.</text><text x="28" y="226" fill="#243f47" font-size="14">No sabemos si se creó la orden.</text><text x="28" y="260" fill="#243f47" font-size="14">Referencia: OP-DEMO-01</text><text x="28" y="294" fill="#243f47" font-size="14"></text><text x="28" y="328" fill="#243f47" font-size="14">No envíes otra orden a ciegas.</text><text x="28" y="362" fill="#243f47" font-size="14">Comprueba al recuperar conexión.</text><text x="28" y="396" fill="#243f47" font-size="14"></text><text x="28" y="430" fill="#243f47" font-size="14">Conservar selección en memoria.</text><text x="28" y="464" fill="#243f47" font-size="14">Sin dato: no inventar estado.</text><text x="28" y="498" fill="#243f47" font-size="14">Confirmada: abrir seguimiento.</text><text x="28" y="532" fill="#243f47" font-size="14">En curso: seguir esperando.</text><rect x="16" y="650" width="343" height="48" rx="8" fill="#126574"/><text x="187.5" y="680" text-anchor="middle" fill="white" font-size="15">Comprobar operación</text><text x="16" y="735" fill="#526b73" font-size="12">Datos ficticios · Wireframe 375 px</text><text x="16" y="759" fill="#526b73" font-size="12">Semana 10 · Desplazamiento vertical</text></g></svg>