<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc"><title id="title">Seleccionar pruebas disponibles</title><desc id="desc">Wireframe anotado estático. Datos ficticios. Interfaz propuesta de órdenes desde EMR.</desc><rect width="1100" height="700" fill="#f2f6f7"/><rect width="1100" height="76" fill="#153e49"/><g font-family="Arial,sans-serif"><text x="28" y="34" fill="white" font-size="18" font-weight="bold">HIS / ÓRDENES DE LABORATORIO</text><text x="28" y="59" fill="#d0e2e6" font-size="14">Hospital H-01 · Sesión demo · Contexto EMR</text><text x="28" y="122" fill="#193c46" font-size="25" font-weight="bold">Seleccionar pruebas disponibles</text><rect x="28" y="150" width="690" height="432" rx="12" fill="white" stroke="#cbd9dd"/><text x="756" y="178" fill="#193c46" font-size="17" font-weight="bold">ANOTACIONES UX</text><text x="48" y="188" fill="#243f47" font-size="16">Paciente DEMO-001 · EP-01 · H-01</text><text x="48" y="222" fill="#243f47" font-size="16">Catálogo de demostración · Buscar prueba [ Glucosa ]</text><text x="48" y="256" fill="#243f47" font-size="16"></text><text x="48" y="290" fill="#243f47" font-size="16">[x] P-DEMO-01 · Glucosa · Disponible</text><text x="48" y="324" fill="#243f47" font-size="16">[ ] P-DEMO-02 · Hemograma · Disponible</text><text x="48" y="358" fill="#243f47" font-size="16">[—] P-DEMO-03 · Prueba demo · No disponible</text><text x="48" y="392" fill="#243f47" font-size="16"></text><text x="48" y="426" fill="#243f47" font-size="16">1 prueba seleccionada · Ver selección</text><text x="48" y="460" fill="#243f47" font-size="16">El catálogo se volverá a comprobar al emitir.</text><text x="48" y="494" fill="#243f47" font-size="16">Ayuda: consulta el procedimiento de solicitud.</text><text x="756" y="216" fill="#3c5962" font-size="15">1. Selección mínima: una prueba.</text><text x="756" y="246" fill="#3c5962" font-size="15">2. No disponible no seleccionable.</text><text x="756" y="276" fill="#3c5962" font-size="15">3. Error junto al grupo si está vacío.</text><text x="756" y="306" fill="#3c5962" font-size="15">4. Conservar selección al volver.</text><text x="756" y="336" fill="#3c5962" font-size="15">5. Catálogo fallido: reintentar;</text><text x="756" y="366" fill="#3c5962" font-size="15">   no fingir que no hay pruebas.</text><rect x="28" y="606" width="420" height="48" rx="8" fill="#126574"/><text x="48" y="637" fill="white" font-size="17">Revisar orden</text><text x="756" y="637" fill="#526b73" font-size="14">Propuesta estática · Semana 8</text></g></svg>