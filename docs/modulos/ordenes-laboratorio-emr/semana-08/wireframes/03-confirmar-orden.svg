<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc"><title id="title">Revisar y confirmar orden</title><desc id="desc">Wireframe anotado estático. Datos ficticios. Interfaz propuesta de órdenes desde EMR.</desc><rect width="1100" height="700" fill="#f2f6f7"/><rect width="1100" height="76" fill="#153e49"/><g font-family="Arial,sans-serif"><text x="28" y="34" fill="white" font-size="18" font-weight="bold">HIS / ÓRDENES DE LABORATORIO</text><text x="28" y="59" fill="#d0e2e6" font-size="14">Hospital H-01 · Sesión demo · Contexto EMR</text><text x="28" y="122" fill="#193c46" font-size="25" font-weight="bold">Revisar y confirmar orden</text><rect x="28" y="150" width="690" height="432" rx="12" fill="white" stroke="#cbd9dd"/><text x="756" y="178" fill="#193c46" font-size="17" font-weight="bold">ANOTACIONES UX</text><text x="48" y="188" fill="#243f47" font-size="16">Paciente DEMO-001 · A. Ejemplo</text><text x="48" y="222" fill="#243f47" font-size="16">Expediente EXP-DEMO-01 · Episodio EP-01</text><text x="48" y="256" fill="#243f47" font-size="16">Hospital H-01 · Profesional DEMO-EMISOR</text><text x="48" y="290" fill="#243f47" font-size="16"></text><text x="48" y="324" fill="#243f47" font-size="16">Prueba seleccionada: P-DEMO-01 · Glucosa</text><text x="48" y="358" fill="#243f47" font-size="16">Se emitirá la orden con todas sus partidas.</text><text x="48" y="392" fill="#243f47" font-size="16">Se comprobarán permiso, contexto y disponibilidad.</text><text x="48" y="426" fill="#243f47" font-size="16"></text><text x="48" y="460" fill="#243f47" font-size="16">← Volver a selección sin guardar</text><text x="756" y="216" fill="#3c5962" font-size="15">1. Resumen antes de persistir.</text><text x="756" y="246" fill="#3c5962" font-size="15">2. Cancelar no crea una orden.</text><text x="756" y="276" fill="#3c5962" font-size="15">3. Confirmar bloquea doble envío.</text><text x="756" y="306" fill="#3c5962" font-size="15">4. Mostrar “Emitiendo…” en carga.</text><text x="756" y="336" fill="#3c5962" font-size="15">5. Éxito solo tras respuesta</text><text x="756" y="366" fill="#3c5962" font-size="15">   de guardado completo.</text><rect x="28" y="606" width="420" height="48" rx="8" fill="#126574"/><text x="48" y="637" fill="white" font-size="17">Confirmar emisión</text><text x="756" y="637" fill="#526b73" font-size="14">Propuesta estática · Semana 8</text></g></svg>