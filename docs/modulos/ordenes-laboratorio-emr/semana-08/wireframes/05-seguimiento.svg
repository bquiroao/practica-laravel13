<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc"><title id="title">Seguimiento del episodio</title><desc id="desc">Wireframe anotado estático. Datos ficticios. Interfaz propuesta de órdenes desde EMR.</desc><rect width="1100" height="700" fill="#f2f6f7"/><rect width="1100" height="76" fill="#153e49"/><g font-family="Arial,sans-serif"><text x="28" y="34" fill="white" font-size="18" font-weight="bold">HIS / ÓRDENES DE LABORATORIO</text><text x="28" y="59" fill="#d0e2e6" font-size="14">Hospital H-01 · Sesión demo · Contexto EMR</text><text x="28" y="122" fill="#193c46" font-size="25" font-weight="bold">Seguimiento del episodio</text><rect x="28" y="150" width="690" height="432" rx="12" fill="white" stroke="#cbd9dd"/><text x="756" y="178" fill="#193c46" font-size="17" font-weight="bold">ANOTACIONES UX</text><text x="48" y="188" fill="#243f47" font-size="16">H-01 · Consulta autorizada · EP-01</text><text x="48" y="222" fill="#243f47" font-size="16">Orden ORD-DEMO-01 · P-DEMO-01 Glucosa</text><text x="48" y="256" fill="#243f47" font-size="16">Estado confirmado: ESTADO_DEMO_INICIAL</text><text x="48" y="290" fill="#243f47" font-size="16">Última lectura: 27 oct 2026, 12:05 Guatemala</text><text x="48" y="324" fill="#243f47" font-size="16"></text><text x="48" y="358" fill="#243f47" font-size="16">Historial autorizado de seguimiento</text><text x="48" y="392" fill="#243f47" font-size="16">27 oct, 12:00 · Emisión confirmada · DEMO-EMISOR</text><text x="48" y="426" fill="#243f47" font-size="16"></text><text x="48" y="460" fill="#243f47" font-size="16">No se cambian estados manualmente desde esta vista.</text><text x="756" y="216" fill="#3c5962" font-size="15">1. Filtrar por contexto autorizado.</text><text x="756" y="246" fill="#3c5962" font-size="15">2. Carga no borra la última hora.</text><text x="756" y="276" fill="#3c5962" font-size="15">3. Lectura fallida: dato obsoleto,</text><text x="756" y="306" fill="#3c5962" font-size="15">   no presentar estado actual.</text><text x="756" y="336" fill="#3c5962" font-size="15">4. Origen de estado autorizado.</text><text x="756" y="366" fill="#3c5962" font-size="15">5. No mostrar motivos sensibles</text><text x="756" y="396" fill="#3c5962" font-size="15">   en listados generales.</text><rect x="28" y="606" width="420" height="48" rx="8" fill="#126574"/><text x="48" y="637" fill="white" font-size="17">Actualizar seguimiento</text><text x="756" y="637" fill="#526b73" font-size="14">Propuesta estática · Semana 8</text></g></svg>