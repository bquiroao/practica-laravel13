<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inicio · Hospital HIS</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <a class="saltar" href="#contenido">Saltar al contenido</a>
  <header class="barra">
    <strong>Hospital HIS</strong>
    <span>H. Central · <span id="rol-actual"></span></span>
    <nav id="menu" aria-label="Módulos"></nav>
  </header>
  <main id="contenido" tabindex="-1"></main>
  <div id="aviso-sesion" role="alertdialog" aria-modal="true" aria-labelledby="aviso-titulo" aria-describedby="aviso-texto" hidden>
    <h2 id="aviso-titulo">Tu sesión vence en 2 minutos</h2><p id="aviso-texto">Si sigues conectado, no pierdes lo que estás viendo.</p>
    <div class="acciones"><button type="button" class="principal" id="seguir">Seguir conectado</button><button type="button" id="salir">Cerrar sesión</button></div>
  </div>
  <footer class="panel">
    <strong>Panel del prototipo</strong> (datos ficticios, sin conexión a la API)
    <label>Rol <select id="rol"><option value="enfermeria">Enfermería</option><option value="admin">Administrador</option></select></label>
    <label>Respuesta de «Citas de hoy» <select id="simular"><option value="normal">Normal (18)</option><option value="vacio">Vacía (0)</option><option value="falla">Falla (E5)</option><option value="lenta">Lenta (más de 10 s, E2)</option></select></label>
    <button type="button" id="simular-sesion">Simular: la sesión vence en 2 minutos</button>
  </footer>
  <script src="app.js"></script>
</body>
</html>
