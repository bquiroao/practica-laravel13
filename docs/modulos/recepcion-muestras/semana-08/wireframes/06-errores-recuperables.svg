<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">WF-06 — Errores recuperables y estados pendientes</title>
  <desc id="desc">Wireframe de recuperación ante indisponibilidad de consulta de órdenes o resultado incierto al guardar, preservando entradas y previniendo decisiones o muestras duplicadas.</desc>
  <rect width="1280" height="820" fill="#f3f6fa"/>
  <rect width="1280" height="74" fill="#12304a"/>
  <text x="34" y="46" fill="#fff" font-family="Arial,sans-serif" font-size="24" font-weight="700">Sistema Hospitalario Integrado</text>
  <text x="1040" y="44" fill="#d8e6f1" font-family="Arial,sans-serif" font-size="15">Hospital activo: Central</text>
  <rect y="74" width="222" height="746" fill="#e8eef4"/>
  <text x="26" y="126" fill="#25445e" font-family="Arial,sans-serif" font-size="16" font-weight="700">Recepción</text>
  <rect x="12" y="145" width="198" height="44" rx="7" fill="#d2e5f4"/>
  <text x="30" y="173" fill="#123b59" font-family="Arial,sans-serif" font-size="15" font-weight="700">Nueva recepción</text>
  <text x="250" y="120" fill="#17354e" font-family="Arial,sans-serif" font-size="28" font-weight="700">No pudimos verificar la orden</text>
  <text x="250" y="151" fill="#50677b" font-family="Arial,sans-serif" font-size="16">Estado técnico pendiente · no se confirmó aceptación ni rechazo.</text>
  <rect x="250" y="180" width="980" height="118" rx="10" fill="#fff4dc" stroke="#e8c675"/>
  <circle cx="285" cy="218" r="16" fill="#b67a13"/>
  <text x="280" y="224" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700">!</text>
  <text x="316" y="215" fill="#77520c" font-family="Arial,sans-serif" font-size="17" font-weight="700">El servicio de órdenes no respondió.</text>
  <text x="316" y="242" fill="#77520c" font-family="Arial,sans-serif" font-size="15">No pudimos verificar la orden; la recepción no se confirmó. La referencia ingresada se conserva.</text>
  <text x="316" y="270" fill="#77520c" font-family="Arial,sans-serif" font-size="14">No marques la muestra como rechazada por esta falla. Reintenta la consulta o solicita soporte autorizado.</text>
  <rect x="250" y="318" width="600" height="252" rx="9" fill="#fff" stroke="#cbd7e1"/>
  <text x="277" y="356" fill="#29475f" font-family="Arial,sans-serif" font-size="18" font-weight="700">Datos conservados</text>
  <text x="277" y="395" fill="#647b8c" font-family="Arial,sans-serif" font-size="13" font-weight="700">REFERENCIA INGRESADA</text>
  <rect x="277" y="405" width="540" height="42" rx="6" fill="#f6f8fa" stroke="#d5dfe6"/>
  <text x="295" y="432" fill="#213d53" font-family="Arial,sans-serif" font-size="15">ORD-00482</text>
  <text x="277" y="478" fill="#647b8c" font-family="Arial,sans-serif" font-size="13" font-weight="700">ESTADO DEL FLUJO</text>
  <rect x="277" y="489" width="180" height="31" rx="15" fill="#fff4dc"/>
  <text x="296" y="510" fill="#77520c" font-family="Arial,sans-serif" font-size="14" font-weight="700">Sin decisión guardada</text>
  <text x="277" y="548" fill="#526a7e" font-family="Arial,sans-serif" font-size="13">Reintentar consulta no crea otro espécimen.</text>
  <rect x="873" y="318" width="357" height="252" rx="9" fill="#fff" stroke="#cbd7e1"/>
  <text x="899" y="356" fill="#29475f" font-family="Arial,sans-serif" font-size="18" font-weight="700">Siguiente paso seguro</text>
  <text x="899" y="395" fill="#526a7e" font-family="Arial,sans-serif" font-size="14">1. Verifica la conexión autorizada.</text>
  <text x="899" y="426" fill="#526a7e" font-family="Arial,sans-serif" font-size="14">2. Reintenta la consulta de la orden.</text>
  <text x="899" y="457" fill="#526a7e" font-family="Arial,sans-serif" font-size="14">3. Si persiste, contacta soporte.</text>
  <rect x="899" y="484" width="304" height="41" rx="7" fill="#12608a"/>
  <text x="964" y="511" fill="#fff" font-family="Arial,sans-serif" font-size="15" font-weight="700">Reintentar consulta</text>
  <rect x="899" y="533" width="304" height="27" rx="6" fill="#fff" stroke="#8ba0b0"/>
  <text x="977" y="552" fill="#29475f" font-family="Arial,sans-serif" font-size="13">Guardar para continuar luego</text>
  <rect x="250" y="592" width="980" height="116" rx="9" fill="#fbeeed" stroke="#e2a49c"/>
  <text x="276" y="625" fill="#762b25" font-family="Arial,sans-serif" font-size="16" font-weight="700">Si el guardado tuvo respuesta incierta</text>
  <text x="276" y="652" fill="#762b25" font-family="Arial,sans-serif" font-size="14">No repitas Guardar a ciegas. Consulta el estado usando la misma referencia de operación.</text>
  <text x="276" y="678" fill="#762b25" font-family="Arial,sans-serif" font-size="14">Recupera el specimenId existente si se guardó; si no, permite reintentar de forma segura.</text>
  <rect x="250" y="730" width="980" height="59" rx="8" fill="#eaf5fb" stroke="#a9cee2"/>
  <text x="276" y="756" fill="#1d536e" font-family="Arial,sans-serif" font-size="14" font-weight="700">Anotación: conservar entradas, explicar el estado, exponer una acción segura y no filtrar datos del paciente en mensajes generales.</text>
</svg>
