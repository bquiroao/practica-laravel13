<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Disponibilidad — Médicos (responsive)</title>
<style>
:root{--ink:#222;--mut:#555;--err:#b00020;--ac:#0b5ed7;--nav:#12303b}
*{box-sizing:border-box}body{margin:0;font:16px/1.4 Arial,sans-serif;color:var(--ink);background:#fafafa;padding-bottom:64px}
header{background:var(--nav);color:#fff;padding:12px 16px}header b{font-size:18px}
main{padding:16px;max-width:960px;margin:auto}h1{font-size:20px;margin:0 0 4px}
.f{display:grid;gap:12px;margin-top:12px}label{display:block;font-weight:bold;margin-bottom:4px}
input,select,button{font:inherit;min-height:44px;width:100%;padding:8px 10px;border:1px solid #777;border-radius:6px;background:#fff}
button{background:var(--nav);color:#fff;border:0;font-weight:bold}:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.h{color:var(--mut);font-size:14px}.cards{display:grid;gap:10px;margin:16px 0 0;padding:0;list-style:none}
.card{background:#fff;border:1px solid #bbb;border-radius:8px;padding:12px}.card b{display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.chips button{width:auto;min-width:72px;background:#fff;color:var(--nav);border:2px solid var(--nav)}
table{display:none;width:100%;border-collapse:collapse;margin-top:16px;background:#fff}td,th{border:1px solid #999;padding:8px;text-align:left}th{background:#e6e6e6}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #999}.tabs a{flex:1;min-height:56px;display:flex;align-items:center;justify-content:center;color:var(--nav);font-weight:bold;text-decoration:none}
.tabs a[aria-current]{background:#d8eeea}
@media (min-width:431px){.f{grid-template-columns:1fr 1fr}.f .full{grid-column:1/-1}}
@media (min-width:768px){.f{grid-template-columns:1fr 1fr 1fr auto;align-items:end}.f .full{grid-column:auto}button.buscar{width:auto;padding:8px 24px}
 .cards{display:none}table{display:table}.tabs{position:static;border:0;background:transparent;padding:0 16px}.tabs a{flex:0 0 auto;padding:0 16px;color:#fff}.tabs a[aria-current]{background:#0b3a40}header{display:flex;align-items:center;gap:24px}body{padding-bottom:0}}
</style>
