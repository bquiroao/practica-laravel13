openapi: 3.0.3
info:
  title: Traslados, altas y liberación de camas (Micro-HIS)
  version: 1.0.0
  description: Registra el traslado o el alta ordenados por el médico y deja la cama, la estancia, la orden y el episodio consistentes en una sola transacción.
servers: [{ url: http://localhost:8080 }]
paths:
  /api/v1/traslados-altas/movimientos:
    post:
      summary: Ejecutar el traslado o el alta de un episodio (CU-02 y CU-03)
      parameters:
        - { name: X-Usuario-Demo, in: header, required: true, schema: { type: string }, description: "Identidad de demostración; se reemplaza por el token del módulo RBAC. Solo enfermería y admisión" }
        - { name: X-Request-Id, in: header, schema: { type: string, pattern: "^[A-Za-z0-9-]{8,64}$" }, description: "Correlación; si falta, el servidor genera uno y lo devuelve en la respuesta" }
        - { name: Idempotency-Key, in: header, schema: { type: string, pattern: "^[A-Za-z0-9-]{8,64}$" }, description: "Reintentar con la misma clave devuelve el mismo resultado sin mover otra cama" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [episodio_id, tipo]
              properties:
                episodio_id: { type: string }
                tipo: { type: string, enum: [traslado, alta] }
                destino_id: { type: string, description: "Cama destino; solo en traslado (la elige enfermería al ejecutar)" }
            example: { episodio_id: epi-1, tipo: traslado, destino_id: bed-a2 }
      responses:
        "201": { description: "Movimiento aplicado", content: { application/json: { schema: { $ref: "#/components/schemas/Movimiento" } } } }
        "200": { description: "Clave de idempotencia ya usada: mismo resultado, nada nuevo", content: { application/json: { schema: { $ref: "#/components/schemas/Movimiento" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
components:
  responses:
    Error: { description: "Error con código estable", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  schemas:
    Movimiento:
      type: object
      properties:
        aplicado: { type: boolean, enum: [true] }
        origen_id: { type: string, description: "Cama liberada; queda en maintenance para limpieza" }
        destino_id: { type: string, nullable: true, description: "Cama ocupada; null en el alta" }
        repetida: { type: boolean, enum: [true], description: "Solo en el 200 de un reintento" }
    Error:
      type: object
      required: [codigo]
      properties:
        codigo:
          type: string
          enum: [json_invalido, idempotency_key_invalida, sin_sesion, acceso_denegado, ruta_no_encontrada, metodo_no_permitido, episodio_no_disponible,
                 clave_reutilizada, orden_requerida, sin_cama, cama_no_disponible, cama_no_cumple_requisito, alta_invalida, error_persistencia]
        mensaje: { type: string }
