<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <title>Semana 7 - Secuencia antes y después</title>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs>
  <text x="490" y="24" text-anchor="middle" font-size="16" font-weight="bold">Comparación de secuencia: antes y después del refactor</text>

  <g font-weight="bold" text-anchor="middle">
    <rect x="20" y="40" width="120" height="30" fill="#eef5ff" stroke="#333"/><text x="80" y="60">Usuario</text>
    <rect x="190" y="40" width="150" height="30" fill="#eef5ff" stroke="#333"/><text x="265" y="60">Controller</text>
    <rect x="390" y="40" width="190" height="30" fill="#eef5ff" stroke="#333"/><text x="485" y="60">Caso de uso</text>
    <rect x="640" y="40" width="140" height="30" fill="#eef5ff" stroke="#333"/><text x="710" y="60">Dominio</text>
    <rect x="830" y="40" width="130" height="30" fill="#eef5ff" stroke="#333"/><text x="895" y="60">Repositorio</text>
  </g>

  <g stroke="#999" stroke-dasharray="4,4">
    <path d="M80,70 V540"/><path d="M265,70 V540"/><path d="M485,70 V540"/><path d="M710,70 V540"/><path d="M895,70 V540"/>
  </g>

  <text x="20" y="100" font-weight="bold">ANTES (CaptureOrCorrectResult)</text>
  <g stroke="#333" fill="none" marker-end="url(#a)">
    <path d="M80,120 H265"/><path d="M265,145 H485"/><path d="M485,170 H895"/><path d="M485,210 H895"/>
  </g>
  <g stroke="#333" fill="none" stroke-dasharray="5,3" marker-end="url(#a)">
    <path d="M485,240 H265"/><path d="M265,265 H80"/>
  </g>
  <text x="90" y="114" font-size="12">correct(item, expected, value, reason, actor)</text>
  <text x="495" y="164" font-size="12">currentFor + reglas + appendCorrection</text>
  <text x="90" y="259" font-size="12">ResultOperation + mensaje de UI (texto libre)</text>

  <text x="20" y="310" font-weight="bold">DESPUÉS (EntryService + Value/Range + OutcomeView)</text>
  <g stroke="#333" fill="none" marker-end="url(#a)">
    <path d="M80,330 H265"/><path d="M265,355 H485"/><path d="M485,380 H710"/><path d="M485,420 H895"/><path d="M485,460 H895"/>
  </g>
  <g stroke="#333" fill="none" stroke-dasharray="5,3" marker-end="url(#a)">
    <path d="M485,495 H265"/><path d="M265,520 H80"/>
  </g>
  <text x="90" y="324" font-size="12">correct(CorrectCommand)</text>
  <text x="495" y="374" font-size="12">parse(value) + classify(range)</text>
  <text x="495" y="414" font-size="12">currentFor + versión/estado</text>
  <text x="495" y="454" font-size="12">appendCorrection</text>
  <text x="90" y="514" font-size="12">Outcome(reason, result, flag) y OutcomeView mapea texto/código</text>

  <rect x="20" y="530" width="940" height="24" fill="#fff8dc" stroke="#333"/>
  <text x="30" y="546" font-size="12">Cambio clave: la capa de aplicación deja de construir mensajes y de manejar valor/unidad/rango en forma implícita.</text>
</svg>
