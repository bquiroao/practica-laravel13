<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc">
  <title id="title">UML de componentes y dependencias del Micro-HIS de resultados</title>
  <desc id="desc">Diagrama por capas: Presentation CLI llama al caso de uso; Application define puertos; Domain modela versiones; Persistence implementa repositorio PDO SQLite e Infrastructure genera IDs.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#40586e"/>
    </marker>
    <marker id="openArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3" fill="none" stroke="#40586e" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1280" height="700" fill="#f4f7fa"/>
  <text x="35" y="45" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17354e">UML - Componentes y dependencias</text>
  <text x="35" y="72" font-family="Arial,sans-serif" font-size="14" fill="#536b7f">Las capas internas no dependen de detalles de consola ni de SQL.</text>
  <rect x="28" y="115" width="222" height="500" rx="12" fill="#eaf1f6" stroke="#7990a2" stroke-width="2"/>
  <text x="139" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#29475f">Presentation</text>
  <rect x="54" y="213" width="170" height="92" rx="8" fill="#fff" stroke="#34789b" stroke-width="2"/>
  <text x="139" y="247" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#164b69">LabResultCommand</text>
  <text x="139" y="274" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#536b7f">CLI / entrada y salida</text>
  <rect x="280" y="115" width="300" height="500" rx="12" fill="#edf5ec" stroke="#809c74" stroke-width="2"/>
  <text x="430" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#3d5d35">Application</text>
  <rect x="310" y="195" width="240" height="91" rx="8" fill="#fff" stroke="#5b8b4f" stroke-width="2"/>
  <text x="430" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#375b2e">CaptureOrCorrectResult</text>
  <text x="430" y="257" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#536b7f">caso de uso</text>
  <rect x="310" y="355" width="113" height="71" rx="8" fill="#fff" stroke="#5b8b4f" stroke-width="2"/>
  <text x="366" y="382" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#375b2e">LabResult</text>
  <text x="366" y="403" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#375b2e">Repository</text>
  <rect x="437" y="355" width="113" height="71" rx="8" fill="#fff" stroke="#5b8b4f" stroke-width="2"/>
  <text x="493" y="382" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#375b2e">Result ID</text>
  <text x="493" y="403" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#375b2e">Generator</text>
  <rect x="610" y="115" width="290" height="500" rx="12" fill="#f5eff9" stroke="#9a80ad" stroke-width="2"/>
  <text x="755" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#614b70">Domain</text>
  <rect x="638" y="215" width="234" height="82" rx="8" fill="#fff" stroke="#8b68a1" stroke-width="2"/>
  <text x="755" y="249" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#614b70">PendingLabResult</text>
  <text x="755" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#536b7f">capturable y corregible</text>
  <rect x="638" y="330" width="234" height="72" rx="8" fill="#fff" stroke="#8b68a1" stroke-width="2"/>
  <text x="755" y="359" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#614b70">ValidatedLabResult</text>
  <text x="755" y="382" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#536b7f">solo lectura</text>
  <rect x="638" y="440" width="234" height="72" rx="8" fill="#fff" stroke="#8b68a1" stroke-width="2"/>
  <text x="755" y="470" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#614b70">ResultVersion</text>
  <text x="755" y="492" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#536b7f">valor inmutable con autoria</text>
  <rect x="930" y="115" width="320" height="500" rx="12" fill="#f8f1e8" stroke="#b89b76" stroke-width="2"/>
  <text x="1090" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#705333">Adapters</text>
  <rect x="960" y="205" width="260" height="82" rx="8" fill="#fff" stroke="#b07d35" stroke-width="2"/>
  <text x="1090" y="239" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#705333">PdoLabResultRepository</text>
  <text x="1090" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#536b7f">SQL preparado</text>
  <path d="M1015 360 C1015 337 1165 337 1165 360 L1165 415 C1165 438 1015 438 1015 415 Z" fill="#fff" stroke="#b07d35" stroke-width="2"/>
  <ellipse cx="1090" cy="360" rx="75" ry="18" fill="#fff" stroke="#b07d35" stroke-width="2"/>
  <text x="1090" y="394" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#705333">SQLite</text>
  <rect x="960" y="475" width="260" height="82" rx="8" fill="#fff" stroke="#b07d35" stroke-width="2"/>
  <text x="1090" y="508" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#705333">RandomResultIdentifier</text>
  <text x="1090" y="534" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#536b7f">adaptador de ID</text>
  <line x1="225" y1="260" x2="305" y2="240" stroke="#40586e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="266" y="231" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#40586e">invoca</text>
  <line x1="550" y1="242" x2="632" y2="255" stroke="#40586e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="590" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#40586e">crea version</text>
  <line x1="430" y1="287" x2="366" y2="349" stroke="#40586e" stroke-width="2" marker-end="url(#openArrow)"/>
  <line x1="430" y1="287" x2="493" y2="349" stroke="#40586e" stroke-width="2" marker-end="url(#openArrow)"/>
  <line x1="755" y1="297" x2="755" y2="433" stroke="#40586e" stroke-width="2" marker-end="url(#openArrow)"/>
  <line x1="755" y1="402" x2="755" y2="433" stroke="#40586e" stroke-width="2" marker-end="url(#openArrow)"/>
  <line x1="550" y1="390" x2="952" y2="246" stroke="#40586e" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#openArrow)"/>
  <text x="750" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#40586e">implementa puerto</text>
  <line x1="1220" y1="248" x2="1227" y2="248" stroke="#40586e" stroke-width="2"/>
  <line x1="1090" y1="287" x2="1090" y2="337" stroke="#40586e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="390" x2="953" y2="515" stroke="#40586e" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#openArrow)"/>
  <text x="756" y="475" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#40586e">implementa puerto de ID</text>
  <text x="35" y="663" font-family="Arial,sans-serif" font-size="12" fill="#64798a">Flecha solida: uso/composicion. Flecha discontinua: adaptador implementa puerto de Application.</text>
</svg>
