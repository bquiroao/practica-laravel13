<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">Contexto C4 — Micro-HIS de ingreso de resultados</title>
  <desc id="desc">Personal de laboratorio usa un prototipo PHP CLI que guarda versiones con PDO en SQLite. Orden e ítem y validación bioquímica son límites externos no integrados.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#40586e"/>
    </marker>
  </defs>
  <rect width="1120" height="500" fill="#f4f7fa"/>
  <text x="40" y="46" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17354e">C4 - Contexto del ingreso de resultados</text>
  <text x="40" y="74" font-family="Arial,sans-serif" font-size="14" fill="#536b7f">Prototipo academico; los limites externos se muestran como dependencias no integradas.</text>
  <rect x="35" y="176" width="190" height="112" rx="12" fill="#fff" stroke="#70879a" stroke-width="2"/>
  <circle cx="130" cy="204" r="16" fill="#dce9f2" stroke="#58758c" stroke-width="2"/>
  <path d="M102 254 Q130 218 158 254 M108 254 L108 270 M152 254 L152 270" fill="none" stroke="#58758c" stroke-width="5"/>
  <text x="130" y="314" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#17354e">Personal de laboratorio</text>
  <text x="130" y="336" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#536b7f">captura autorizada</text>
  <rect x="340" y="155" width="335" height="175" rx="14" fill="#e7f2f8" stroke="#34789b" stroke-width="3"/>
  <text x="507" y="194" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#164b69">Micro-HIS de resultados</text>
  <text x="507" y="224" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#244c63">PHP 8.2 CLI por capas</text>
  <line x1="388" y1="244" x2="627" y2="244" stroke="#a5c2d2"/>
  <text x="507" y="271" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#244c63">captura y correccion versionada</text>
  <text x="507" y="296" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#536b7f">sin validacion ni publicacion clinica</text>
  <ellipse cx="846" cy="228" rx="100" ry="67" fill="#fff" stroke="#70879a" stroke-width="2"/>
  <path d="M760 209 C760 189 932 189 932 209 L932 249 C932 269 760 269 760 249 Z" fill="#e8eef3" stroke="#70879a" stroke-width="2"/>
  <ellipse cx="846" cy="209" rx="86" ry="22" fill="#f8fafc" stroke="#70879a" stroke-width="2"/>
  <text x="846" y="232" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17354e">SQLite</text>
  <text x="846" y="293" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#536b7f">PDO preparado</text>
  <rect x="350" y="390" width="315" height="68" rx="10" fill="#fff8e8" stroke="#c99b38" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="507" y="418" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#6c5017">Orden e item</text>
  <text x="507" y="440" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#6c5017">referencia asumida, sin consulta real</text>
  <rect x="780" y="390" width="300" height="68" rx="10" fill="#fff8e8" stroke="#c99b38" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="930" y="418" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#6c5017">Validacion bioquimica</text>
  <text x="930" y="440" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#6c5017">proceso posterior no implementado</text>
  <line x1="226" y1="230" x2="337" y2="230" stroke="#40586e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="280" y="216" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#40586e">CLI</text>
  <line x1="676" y1="230" x2="748" y2="230" stroke="#40586e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="711" y="214" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#40586e">versions</text>
  <line x1="507" y1="332" x2="507" y2="384" stroke="#9b741f" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <line x1="675" y1="304" x2="785" y2="388" stroke="#9b741f" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="42" y="482" font-family="Arial,sans-serif" font-size="12" fill="#64798a">Flecha discontinua = referencia de contexto, no integracion funcional.</text>
</svg>
