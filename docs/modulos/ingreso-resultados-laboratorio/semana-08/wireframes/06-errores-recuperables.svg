<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
<title id="title">Wireframe 6: errores recuperables</title><desc id="desc">Panel de errores diferenciados para conflicto, resultado validado, fallo de guardado y servicio 503.</desc>
<defs><style>text{font-family:Arial,sans-serif;fill:#172b4d}.small{font-size:13px}.body{font-size:15px}.h{font-size:23px;font-weight:700}.muted{fill:#526581}.line{stroke:#c8d2df;stroke-width:1}.box{fill:#fff;stroke:#c8d2df}.soft{fill:#f3f6fa}.blue{fill:#165d9c}.note{font-size:14px}.badge{fill:#e8f1fb}.ok{fill:#e8f5ec}.warn{fill:#fff2cc}.danger{fill:#fdecec}</style></defs>
<rect width="1280" height="760" fill="#eef2f7"/><rect x="24" y="20" width="1232" height="54" rx="8" fill="#153956"/><text x="48" y="54" fill="#fff" font-size="20" font-weight="700">HIS · Laboratorio</text><text x="930" y="53" fill="#fff" class="body">Hospital Central</text><circle cx="1178" cy="47" r="17" fill="#dbeafe"/><text x="1172" y="53" class="small" font-weight="700">LC</text><text x="1202" y="53" fill="#fff" class="small">Captura autorizada</text>
<rect x="24" y="90" width="850" height="638" rx="8" fill="#fff" stroke="#d4dde8"/><text x="50" y="129" class="h">No se pudo completar la acción</text><text x="50" y="158" class="small muted">Orden O-811 · Glucosa · datos ficticios</text>
<text x="58" y="185" class="body">409 · Conflicto: versión cambió. [Recargar y revisar]</text><text x="58" y="233" class="body">Bloqueado: resultado ya VALIDATED. Ver explicación.</text><text x="58" y="281" class="body">Error de guardado: conserva lo escrito. [Reintentar]</text><text x="58" y="329" class="body">503 · Órdenes no disponible. Retry-After: 30 s</text><text x="58" y="377" class="body">Ningún mensaje de error crea una versión nueva.</text>
<rect x="50" y="510" width="769" height="70" rx="5" class="soft"/><text x="66" y="538" class="body" font-weight="700">Estado y ayuda contextual</text><text x="66" y="562" class="small muted">Los campos muestran etiquetas persistentes y validación en línea.</text>
<rect x="894" y="90" width="362" height="638" rx="8" fill="#fff" stroke="#d4dde8"/><text x="918" y="128" class="h">Anotaciones UX</text><circle cx="927" cy="165" r="14" class="blue"/><text x="923" y="170" fill="#fff" class="small">1</text><text x="952" y="161" class="note">409 exige recargar historial y revisar antes de reenviar.</text><circle cx="927" cy="223" r="14" class="blue"/><text x="923" y="228" fill="#fff" class="small">2</text><text x="952" y="219" class="note">Una versión validada es solo lectura y explica el bloqueo.</text><circle cx="927" cy="281" r="14" class="blue"/><text x="923" y="286" fill="#fff" class="small">3</text><text x="952" y="277" class="note">Fallo de guardado conserva el borrador sin éxito falso.</text><circle cx="927" cy="339" r="14" class="blue"/><text x="923" y="344" fill="#fff" class="small">4</text><text x="952" y="335" class="note">503 muestra disponibilidad y cabecera Retry-After.</text><circle cx="927" cy="397" r="14" class="blue"/><text x="923" y="402" fill="#fff" class="small">5</text><text x="952" y="393" class="note">Cada error tiene acción de recuperación específica.</text><circle cx="927" cy="455" r="14" class="blue"/><text x="923" y="460" fill="#fff" class="small">6</text><text x="952" y="451" class="note">El foco se mueve al mensaje para lectura asistida.</text>
<rect x="918" y="526" width="314" height="150" rx="6" class="soft"/><text x="936" y="554" class="body" font-weight="700">Privacidad y seguridad</text><text x="936" y="581" class="small">Hospital activo siempre visible.</text><text x="936" y="604" class="small">Datos ficticios y mínimo necesario.</text><text x="936" y="627" class="small">Foco visible; estado no solo por color.</text><text x="936" y="650" class="small">No se persiste un éxito antes de confirmar.</text>
</svg>
