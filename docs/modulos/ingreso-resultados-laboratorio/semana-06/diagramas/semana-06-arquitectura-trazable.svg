<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <title>Semana 6 - Arquitectura propuesta trazable</title>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs>
  <text x="490" y="24" text-anchor="middle" font-size="16" font-weight="bold">Arquitectura propuesta con trazabilidad de decisiones (Semana 6)</text>

  <rect x="20" y="56" width="180" height="48" fill="#fff" stroke="#333"/><text x="110" y="85" text-anchor="middle">Técnico/a de laboratorio</text>
  <rect x="20" y="128" width="180" height="56" fill="#fff" stroke="#333" stroke-dasharray="6,3"/><text x="110" y="154" text-anchor="middle">UI Ingreso</text><text x="110" y="172" text-anchor="middle" font-size="11">(propuesta)</text>
  <rect x="20" y="214" width="180" height="48" fill="#fff" stroke="#333"/><text x="110" y="242" text-anchor="middle">Bioquímico/a</text>

  <rect x="240" y="50" width="220" height="210" fill="#eef5ff" stroke="#5b8bd0"/><text x="250" y="72" font-weight="bold">Presentation / API</text>
  <rect x="260" y="88" width="180" height="42" fill="#fff" stroke="#333"/><text x="350" y="110" text-anchor="middle">API REST /api/v1</text><text x="350" y="126" text-anchor="middle" font-size="11">DEC-06</text>
  <rect x="260" y="140" width="180" height="32" fill="#fff" stroke="#333"/><text x="350" y="160" text-anchor="middle">ResultController + Form</text>
  <rect x="260" y="180" width="180" height="32" fill="#fff" stroke="#333"/><text x="350" y="200" text-anchor="middle">Auth/Sesión (actor, hospital)</text>

  <rect x="490" y="50" width="230" height="210" fill="#f1fbf1" stroke="#5aa55a"/><text x="500" y="72" font-weight="bold">Application / Domain</text>
  <rect x="510" y="88" width="190" height="42" fill="#fff" stroke="#333"/><text x="605" y="110" text-anchor="middle">CaptureOrCorrectResult</text><text x="605" y="126" text-anchor="middle" font-size="11">DEC-01, DEC-05</text>
  <rect x="510" y="140" width="190" height="42" fill="#fff" stroke="#333" stroke-dasharray="6,3"/><text x="605" y="162" text-anchor="middle">Policy Value+Unit+Range</text><text x="605" y="178" text-anchor="middle" font-size="11">DEC-04 cambio práctico</text>
  <rect x="510" y="192" width="190" height="32" fill="#fff" stroke="#333"/><text x="605" y="212" text-anchor="middle">LabResult (pendiente/versionado)</text>

  <rect x="750" y="50" width="210" height="210" fill="#f7eefb" stroke="#9a5bb5"/><text x="760" y="72" font-weight="bold">Persistence / Integración</text>
  <rect x="770" y="88" width="170" height="32" fill="#fff" stroke="#333"/><text x="855" y="108" text-anchor="middle">LabResultRepository</text>
  <rect x="770" y="130" width="170" height="42" fill="#fff" stroke="#333"/><text x="855" y="152" text-anchor="middle">Pdo/InMemory Adapter</text><text x="855" y="168" text-anchor="middle" font-size="11">DEC-03</text>
  <rect x="770" y="182" width="170" height="32" fill="#fff8dc" stroke="#333"/><text x="855" y="202" text-anchor="middle">lab_result_versions</text>
  <rect x="770" y="224" width="170" height="32" fill="#eef5ff" stroke="#5b8bd0"/><text x="855" y="244" text-anchor="middle">Órdenes/LIS (referencias)</text>

  <g stroke="#333" fill="none" marker-end="url(#a)">
    <path d="M110,104 V128"/><path d="M200,156 H260"/>
    <path d="M110,214 V170 H260"/>
    <path d="M440,109 H510"/><path d="M440,156 H510"/>
    <path d="M605,130 V140"/><path d="M700,109 H770"/>
    <path d="M855,120 V130"/><path d="M855,172 V182"/>
    <path d="M700,208 H770 V240"/>
    <path d="M350,130 V180"/>
  </g>

  <rect x="20" y="300" width="940" height="290" fill="#fff" stroke="#bbb"/>
  <text x="30" y="326" font-weight="bold">Trazabilidad (decisión - evidencia)</text>
  <text x="30" y="350">DEC-01 Capas y SOLID: Controller->UseCase->Repository. Evidencia: semana-04/ejemplo/src + diagrama.</text>
  <text x="30" y="372">DEC-02 Actor/hospital desde sesión y no del cuerpo. Evidencia: semana-05 propuesta API + contrato simulado.</text>
  <text x="30" y="394">DEC-03 Repository con adaptadores PDO/InMemory. Evidencia: semana-04/ejemplo/src/Persistence.</text>
  <text x="30" y="416">DEC-04 Cambio práctico: exigir valor con unidad y clasificar rango. Evidencia: semana-06/verificacion/cambio-practico.php.</text>
  <text x="30" y="438">DEC-05 Corrección controlada solo en pendiente y con versión esperada. Evidencia: CaptureOrCorrectResult::correct.</text>
  <text x="30" y="460">DEC-06 Contrato API (idempotencia, 409/422/404/503) para evolucionar a cliente-servidor sin extraer microservicio.</text>
  <text x="30" y="484">RF/RNF cubiertos: consistencia por versión, validación de entrada, separación de capas, prueba con adaptador en memoria.</text>
  <text x="30" y="506">Estado del cambio defendido: propuesto y verificado en script; no reemplaza aún al flujo de producción.</text>
</svg>

