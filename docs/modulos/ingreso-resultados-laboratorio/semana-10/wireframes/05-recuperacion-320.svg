<svg xmlns="http://www.w3.org/2000/svg" width="320" height="760" viewBox="0 0 320 760" role="img" aria-labelledby="title desc"><title id="title">Comprobar el guardado</title><desc id="desc">Propuesta móvil de 320 píxeles. Datos ficticios. 05 / CONEXIÓN LIMITADA</desc><rect width="100%" height="100%" fill="#f2f6f7"/><rect width="100%" height="88" fill="#103b46"/><g font-family="Arial, sans-serif"><text x="16" y="29" fill="#b9dedf" font-size="12">MICRO-HIS / LABORATORIO</text><text x="16" y="57" fill="white" font-size="16">H-01 · Operadora DEMO</text><text x="16" y="118" fill="#47636a" font-size="12">05 / CONEXIÓN LIMITADA</text><text x="16" y="150" fill="#103b46" font-size="20" font-weight="bold">Comprobar el guardado</text><rect x="16" y="174" width="288" height="430" rx="12" fill="white" stroke="#cbd9dd"/><text x="28" y="205" fill="#243f47" font-size="14">La respuesta no llegó.</text><text x="28" y="238" fill="#243f47" font-size="14">No sabemos si se guardó.</text><text x="28" y="271" fill="#243f47" font-size="14">Tu entrada sigue en esta sesión.</text><text x="28" y="304" fill="#243f47" font-size="14"></text><text x="28" y="337" fill="#243f47" font-size="14">Orden DEMO-025 · v1 → v2</text><text x="28" y="370" fill="#243f47" font-size="14">Nuevo: 12,5 g/dL</text><text x="28" y="403" fill="#243f47" font-size="14">Motivo: error de transcripción</text><text x="28" y="436" fill="#243f47" font-size="14"></text><text x="28" y="469" fill="#243f47" font-size="14">Comprueba el estado antes</text><text x="28" y="502" fill="#243f47" font-size="14">de volver a enviar.</text><text x="28" y="535" fill="#243f47" font-size="14">← Volver sin borrar</text><rect x="16" y="628" width="288" height="48" rx="8" fill="#126676"/><text x="160" y="658" text-anchor="middle" fill="white" font-size="15">Comprobar estado</text><text x="16" y="710" fill="#47636a" font-size="12">Datos ficticios · Propuesta de diseño</text><text x="16" y="733" fill="#47636a" font-size="12">320 px · Desplazamiento vertical</text></g></svg>