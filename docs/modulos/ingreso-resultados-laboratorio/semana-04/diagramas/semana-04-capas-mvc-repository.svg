<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <title>Semana 4 - Capas, MVC y Repository</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker>
    <marker id="i" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#fff" stroke="#333"/></marker>
  </defs>
  <text x="450" y="24" text-anchor="middle" font-size="16" font-weight="bold">Semana 4 - Capas, MVC y Repository</text>
  <rect x="10" y="40" width="880" height="140" fill="#eef5ff" stroke="#5b8bd0"/>
  <text x="20" y="58" font-weight="bold">Presentation (MVC)</text>
  <rect x="30" y="75" width="150" height="50" fill="#fff" stroke="#333"/><text x="105" y="97" text-anchor="middle">LabResultCommand</text><text x="105" y="113" text-anchor="middle">front controller</text>
  <rect x="250" y="75" width="150" height="50" fill="#fff" stroke="#333"/><text x="325" y="105" text-anchor="middle">ResultController</text>
  <rect x="490" y="60" width="170" height="40" fill="#fff" stroke="#333"/><text x="575" y="85" text-anchor="middle">ResultForm (formato)</text>
  <rect x="490" y="120" width="170" height="40" fill="#fff" stroke="#333"/><text x="575" y="145" text-anchor="middle">ResultView (texto, código)</text>
  <rect x="10" y="200" width="880" height="110" fill="#f1fbf1" stroke="#5aa55a"/>
  <text x="20" y="218" font-weight="bold">Application</text>
  <rect x="250" y="235" width="190" height="50" fill="#fff" stroke="#333"/><text x="345" y="265" text-anchor="middle">CaptureOrCorrectResult</text>
  <rect x="550" y="235" width="210" height="50" fill="#fff8dc" stroke="#333"/><text x="655" y="257" text-anchor="middle">«interface»</text><text x="655" y="273" text-anchor="middle">LabResultRepository</text>
  <rect x="10" y="330" width="430" height="80" fill="#fff4e8" stroke="#d08a3b"/>
  <text x="20" y="348" font-weight="bold">Domain</text>
  <rect x="40" y="360" width="370" height="40" fill="#fff" stroke="#333"/><text x="225" y="385" text-anchor="middle">PendingLabResult · ValidatedLabResult · ResultVersion</text>
  <rect x="460" y="330" width="430" height="140" fill="#f7eefb" stroke="#9a5bb5"/>
  <text x="470" y="348" font-weight="bold">Persistence (adaptadores)</text>
  <rect x="490" y="365" width="170" height="40" fill="#fff" stroke="#333"/><text x="575" y="390" text-anchor="middle">PdoLabResultRepository</text>
  <rect x="680" y="365" width="190" height="40" fill="#fff" stroke="#333"/><text x="775" y="390" text-anchor="middle">InMemoryLabResultRepository</text>
  <rect x="10" y="490" width="880" height="55" fill="#f4f4f4" stroke="#888"/>
  <text x="20" y="508" font-weight="bold">Composición</text>
  <text x="30" y="528">bootstrap.php elige el adaptador con LAB_RESULTS_PERSISTENCE=pdo|memory y ensambla el front controller</text>
  <g stroke="#333" fill="none" marker-end="url(#a)">
    <path d="M180,100 H250"/><path d="M400,90 H490"/><path d="M400,110 L490,135"/>
    <path d="M325,125 V235"/><path d="M440,260 H550"/><path d="M345,285 L260,360"/>
  </g>
  <g stroke="#333" fill="none" stroke-dasharray="5,3" marker-end="url(#i)">
    <path d="M575,365 L620,285"/><path d="M775,365 L720,285"/>
