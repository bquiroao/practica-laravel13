<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <title>Semana 4 - Repositorio de datos compartido</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker>
    <marker id="i" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#fff" stroke="#333"/></marker>
  </defs>
  <text x="450" y="24" text-anchor="middle" font-size="16" font-weight="bold">Semana 4 - Integración de un repositorio compartido</text>
  <rect x="10" y="40" width="480" height="250" fill="#eef5ff" stroke="#5b8bd0"/>
  <text x="20" y="58" font-weight="bold">Micro-HIS de ingreso de resultados</text>
  <rect x="30" y="75" width="150" height="40" fill="#fff" stroke="#333"/><text x="105" y="100" text-anchor="middle">ResultController</text>
  <rect x="250" y="75" width="200" height="40" fill="#fff" stroke="#333"/><text x="350" y="100" text-anchor="middle">CaptureOrCorrectResult</text>
  <rect x="250" y="150" width="200" height="45" fill="#fff8dc" stroke="#333"/><text x="350" y="170" text-anchor="middle">«interface»</text><text x="350" y="186" text-anchor="middle">LabResultRepository</text>
  <rect x="250" y="225" width="200" height="45" fill="#fff" stroke="#333"/><text x="350" y="245" text-anchor="middle">SharedLabResultRepository</text><text x="350" y="261" text-anchor="middle">(adaptador futuro)</text>
  <rect x="520" y="40" width="370" height="130" fill="#f1fbf1" stroke="#5aa55a"/>
  <text x="530" y="58" font-weight="bold">Otros módulos (mismo contrato)</text>
  <rect x="550" y="75" width="150" height="40" fill="#fff" stroke="#333"/><text x="625" y="100" text-anchor="middle">Validación</text>
  <rect x="720" y="75" width="150" height="40" fill="#fff" stroke="#333"/><text x="795" y="100" text-anchor="middle">Entrega (lectura)</text>
  <ellipse cx="600" cy="330" rx="170" ry="40" fill="#f7eefb" stroke="#9a5bb5"/>
  <text x="600" y="326" text-anchor="middle">Repositorio compartido PostgreSQL</text><text x="600" y="344" text-anchor="middle">lab_result_versions</text>
  <text x="20" y="400">Contrato: fuente única de verdad, versiones solo anexadas, estado y versión esperada verificados al escribir.</text>
  <g stroke="#333" fill="none" marker-end="url(#a)">
    <path d="M180,95 H250"/><path d="M350,115 V150"/>
    <path d="M450,260 L480,330 L430,330"/><path d="M625,115 L610,290"/><path d="M795,115 L700,300"/>
  </g>
  <path d="M350,225 V195" stroke="#333" stroke-dasharray="5,3" fill="none" marker-end="url(#i)"/>
</svg>
