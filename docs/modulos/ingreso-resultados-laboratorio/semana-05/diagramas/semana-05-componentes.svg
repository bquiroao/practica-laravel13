<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <title>Semana 5 - Cliente-servidor y frontera del módulo de ingreso de resultados</title>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs>
  <text x="470" y="24" text-anchor="middle" font-size="16" font-weight="bold">Frontera del módulo de ingreso de resultados (sólido: existe; discontinuo: propuesto)</text>

  <rect x="20" y="50" width="170" height="52" fill="#fff" stroke="#333"/><text x="105" y="82" text-anchor="middle">Técnico/a de laboratorio</text>
  <rect x="20" y="170" width="170" height="60" fill="#fff" stroke="#333" stroke-dasharray="6,3"/><text x="105" y="196" text-anchor="middle">Cliente web/móvil</text><text x="105" y="214" text-anchor="middle">(propuesto)</text>

  <rect x="260" y="44" width="500" height="400" fill="#f1fbf1" stroke="#5aa55a" stroke-width="2"/>
  <text x="270" y="64" font-weight="bold">Módulo Ingreso de resultados (monolito modular)</text>
  <rect x="290" y="84" width="440" height="52" fill="#fff" stroke="#333" stroke-dasharray="6,3"/><text x="510" y="106" text-anchor="middle">API REST /api/v1 (adaptador HTTP)</text><text x="510" y="124" text-anchor="middle">propuesto</text>
  <rect x="290" y="170" width="200" height="48" fill="#fff" stroke="#333"/><text x="390" y="200" text-anchor="middle">CaptureOrCorrectResult</text>
  <rect x="530" y="170" width="200" height="48" fill="#fff" stroke="#333"/><text x="630" y="192" text-anchor="middle">Pending / ValidatedLabResult</text><text x="630" y="208" text-anchor="middle" font-size="11">versiones inmutables</text>
  <rect x="290" y="260" width="200" height="48" fill="#fff" stroke="#333"/><text x="390" y="282" text-anchor="middle">LabResultRepository</text><text x="390" y="298" text-anchor="middle" font-size="11">PDO e InMemory</text>
  <rect x="530" y="260" width="200" height="48" fill="#fff" stroke="#333" stroke-dasharray="6,3"/><text x="630" y="290" text-anchor="middle">Outbox de eventos</text>
  <rect x="290" y="350" width="440" height="70" fill="#fff8dc" stroke="#333"/><text x="510" y="376" text-anchor="middle">BD propia: lab_result_versions</text><text x="510" y="396" text-anchor="middle">+ idempotency_keys y outbox (propuestos)</text>

  <rect x="800" y="60" width="130" height="60" fill="#eef5ff" stroke="#5b8bd0"/><text x="865" y="86" text-anchor="middle">Auth / Usuarios</text><text x="865" y="104" text-anchor="middle" font-size="11">sesión, rol, hospital</text>
  <rect x="800" y="170" width="130" height="60" fill="#eef5ff" stroke="#5b8bd0"/><text x="865" y="196" text-anchor="middle">Órdenes</text><text x="865" y="214" text-anchor="middle" font-size="11">otro equipo</text>
  <rect x="800" y="290" width="130" height="60" fill="#f7eefb" stroke="#9a5bb5" stroke-dasharray="6,3"/><text x="865" y="316" text-anchor="middle">Bus de eventos</text><text x="865" y="334" text-anchor="middle" font-size="11">futuro</text>
  <rect x="800" y="390" width="130" height="60" fill="#eef5ff" stroke="#5b8bd0"/><text x="865" y="416" text-anchor="middle">Validación de</text><text x="865" y="434" text-anchor="middle">resultados</text>

  <g stroke="#333" fill="none" marker-end="url(#a)">
    <path d="M105,102 V170"/><path d="M190,200 H250 V110 H290" stroke-dasharray="6,3"/>
    <path d="M510,136 V150 H390 V170"/><path d="M490,194 H530"/>
    <path d="M390,218 V260"/><path d="M390,308 V350"/><path d="M630,308 V350"/>
    <path d="M730,100 H800"/><path d="M730,200 H800" stroke-dasharray="6,3"/><path d="M730,284 H765 V320 H800" stroke-dasharray="6,3"/>
    <path d="M865,350 V390" stroke-dasharray="6,3"/>
  </g>
  <text x="20" y="480" font-weight="bold">Dueño de los datos: Ingreso (versiones de resultado, motivo de corrección, claves de idempotencia).</text>
  <text x="20" y="500">Referencias por identificador, sin copia: ítem de orden, paciente y hospital pertenecen a otros módulos.</text>
  <text x="20" y="520">Decisión: monolito modular con API ahora; extraer un servicio solo si se cumplen los disparadores medibles del documento.</text>
</svg>
