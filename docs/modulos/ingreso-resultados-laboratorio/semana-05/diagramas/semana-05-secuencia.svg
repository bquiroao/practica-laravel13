<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <title>Semana 5 - Corrección con idempotencia y versión esperada</title>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs>
  <text x="470" y="24" text-anchor="middle" font-size="16" font-weight="bold">POST de corrección: idempotencia y versión esperada</text>
  <g font-weight="bold" text-anchor="middle">
    <rect x="20" y="40" width="120" height="30" fill="#eef5ff" stroke="#333"/><text x="80" y="60">Cliente</text>
    <rect x="220" y="40" width="130" height="30" fill="#eef5ff" stroke="#333"/><text x="285" y="60">API Ingreso</text>
    <rect x="440" y="40" width="190" height="30" fill="#eef5ff" stroke="#333"/><text x="535" y="60">CaptureOrCorrectResult</text>
    <rect x="740" y="40" width="160" height="30" fill="#eef5ff" stroke="#333"/><text x="820" y="60">BD Ingreso</text>
  </g>
  <g stroke="#999" stroke-dasharray="4,4"><path d="M80,70 V620"/><path d="M285,70 V620"/><path d="M535,70 V620"/><path d="M820,70 V620"/></g>
  <g stroke="#333" fill="none" marker-end="url(#a)">
    <path d="M80,100 H285"/><path d="M285,130 H820"/><path d="M285,260 H535"/><path d="M535,290 H820"/><path d="M535,470 H820"/>
  </g>
  <g stroke="#333" fill="none" stroke-dasharray="5,3" marker-end="url(#a)">
    <path d="M820,150 H285"/><path d="M285,170 H80"/><path d="M820,310 H535"/>
    <path d="M285,340 H80"/><path d="M285,380 H80"/><path d="M285,420 H80"/><path d="M285,500 H80"/>
  </g>
  <text x="90" y="94" font-size="12">POST corrección + Idempotency-Key K2 + expectedVersionId</text>
  <text x="300" y="124" font-size="12">¿existe K2?</text>
  <text x="540" y="144" font-size="12">existe, mismo contenido</text>
  <text x="90" y="164" font-size="12">respuesta original</text>
  <text x="90" y="198" font-size="12" fill="#721c24">existe, otro contenido: 409</text>
  <text x="300" y="254" font-size="12">K2 nueva: correct(item, expectedVersionId, valor, motivo, actor)</text>
  <text x="550" y="284" font-size="12">currentFor(item)</text>
  <text x="90" y="334" font-size="12" fill="#721c24">no existe: 404</text>
  <text x="90" y="374" font-size="12" fill="#721c24">ya validado: 409, no se corrige</text>
  <text x="90" y="414" font-size="12" fill="#721c24">versión distinta de la esperada: 409, recargar</text>
  <text x="550" y="464" font-size="12">vigente y pendiente: corrección + clave + outbox</text>
  <text x="550" y="484" font-size="12">una sola transacción</text>
  <text x="90" y="494" font-size="12">201 nueva versión pendiente</text>
  <rect x="20" y="530" width="900" height="80" fill="#fff8dc" stroke="#333"/>
  <text x="32" y="554">El actor sale de la sesión; el cuerpo no puede declarar quién captura.</text>
  <text x="32" y="576">Una corrección nunca sobrescribe: agrega una versión nueva con motivo y versión previa.</text>
  <text x="32" y="598">Propuesta: el prototipo de la Semana 4 no tiene API, idempotencia, hospital, verificación de Órdenes ni outbox.</text>
</svg>
